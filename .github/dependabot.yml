version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
