<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Wreck Yard native CPU profile</title><style>html,body{margin:0;overflow:hidden;background:#181f29}</style></head>
<body><div id="root"></div><script type="module">
// This separate development entry is not imported by the production app.
import { registerPhysicsProfileArtifact } from '@series-inc/rundot-syncplay/physics/3d/profile';
import { initPhysics3D } from '@series-inc/rundot-syncplay/physics/3d';
const memories = new Set();
function retain(instance) {
  for (const value of Object.values(instance.exports)) if (value instanceof WebAssembly.Memory) memories.add(value);
}
const instantiate = WebAssembly.instantiate.bind(WebAssembly);
WebAssembly.instantiate = async (...args) => {
  const result = await instantiate(...args);
  retain(result.instance ?? result);
  return result;
};
const Instance = WebAssembly.Instance;
WebAssembly.Instance = new Proxy(Instance, { construct(target, args) {
  const instance = Reflect.construct(target, args);
  retain(instance);
  return instance;
} });
window.__WRECK_WASM_MEMORY_BYTES__ = () => [...memories].reduce((bytes, memory) => bytes + memory.buffer.byteLength, 0);
registerPhysicsProfileArtifact();
await initPhysics3D({ artifact: 'profile' });
await import('/src/main.tsx');
const { perfCount } = await import('/src/perf/recorder.ts');
setInterval(() => perfCount('memory.wasmBytes', window.__WRECK_WASM_MEMORY_BYTES__()), 1000);
</script></body>
</html>
