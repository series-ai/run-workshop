<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="game-id" content="dither-playground" />
    <title>Dither Playground</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0d0f0a;
      }
      body {
        -webkit-font-smoothing: antialiased;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :focus-visible {
        outline: 1px solid #9bbc0f;
        outline-offset: 1px;
      }
      /* Native dropdown popups don't inherit inline styles. */
      select option {
        background: #1a1d14;
        color: #e8ecc8;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2c3320;
        border: 2px solid #14170d;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #306230;
      }
      @keyframes dp-blink {
        0%,
        55% {
          opacity: 1;
        }
        56%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
