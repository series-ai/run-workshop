<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INKLINE figure correction</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#eeece5;color:#151716;font:14px/1.4 system-ui}main{max-width:1320px;margin:auto;padding:24px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 8px}p{color:#666b63;margin:0 0 16px}nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}button,select{font:inherit;border:1px solid #c7c9c1;padding:8px 12px;background:#f7f5ef;border-radius:6px}button:active{transform:scale(.97)}input{flex:1;min-width:160px}canvas{display:block;width:100%;border-bottom:1px solid #c4c7bd}#labels{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font:11px monospace;letter-spacing:2px;padding:8px}#sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}figure{margin:0;border:1px solid #c9cbc3;background:#f7f5ef}figure img{display:block;width:100%}figcaption{padding:6px;font:11px monospace}h2{font-size:18px;margin:20px 0 8px}.contact{border-color:#d45538}#status{font:12px monospace;color:#d45538}
</style><main><h1>One line. One common node.</h1><p>New exported GLB. Fixed camera scale. No effects. Three views at normal speed.</p><nav><select id="clip"></select><button id="play">Pause</button><input id="time" type="range" min="0" max="1" step=".001"><output id="readout"></output><button id="frames">Build phase sheet</button></nav><canvas id="view"></canvas><div id="labels"><span>FRONT</span><span>SIDE</span><span>THREE-QUARTER</span></div><div id="status">Loading new GLB…</div><h2>Side view phases</h2><div id="sheet"></div></main><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {AssetLibrary,mountEquipment,supportEquipment} from '/src/runtime/assets.ts';
const base=new URLSearchParams(location.search).get('assets')||'/.cache/correction-character-prototype';
const id=new URLSearchParams(location.search).get('body')||'stick-standard';
const catalog=await fetch(base+'/characters.json').then(r=>r.json());
const gltf=await new GLTFLoader().loadAsync(base+'/characters/'+id+'.glb');
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1260,430,false);
const scene=new THREE.Scene();scene.background=new THREE.Color('#eeece5');scene.add(gltf.scene);
const grid=new THREE.GridHelper(5,10,0xb9bdb3,0xd6d7ce);scene.add(grid);
const cameras=[[0,1.05,5],[5,1.05,0],[4,1.65,4]].map(p=>{const c=new THREE.OrthographicCamera(-1.35,1.35,1.38,-1.38,.01,50);c.position.fromArray(p);c.lookAt(0,1.02,0);return c});
const manifest=await fetch('/assets/manifest.json').then(r=>r.json());const library=new AssetLibrary(manifest,new URL('/',location.href));let held=null;
async function equip(id){if(held){held.root.removeFromParent();held=null}if(id){held=await library.create(id);mountEquipment(gltf.scene,held,gltf.animations,catalog.animations)}for(const [index,camera] of cameras.entries()){camera.left=id?-1.9:-1.35;camera.right=-camera.left;camera.top=id?1.95:1.38;camera.bottom=-camera.top;const position=[[0,1.05,5],[5,1.05,0],[4,1.65,4]][index];camera.position.set(position[0],position[1],position[2]+(id ? .45 : 0));camera.lookAt(0,1.02,id ? .45 : 0);camera.updateProjectionMatrix()}}
const mixer=new THREE.AnimationMixer(gltf.scene);let action,selected,playing=true,t=0,previous=performance.now();
const select=document.querySelector('select'),range=document.querySelector('input'),readout=document.querySelector('output');
for(const clip of catalog.animations){const o=document.createElement('option');o.value=clip.id;o.textContent=clip.id;select.append(o)}
function choose(id){mixer.stopAllAction();selected=catalog.animations.find(c=>c.id===id);action=mixer.clipAction(gltf.animations.find(c=>c.name===id)).setLoop(THREE.LoopOnce,1);action.clampWhenFinished=true;action.play();t=0;range.max=selected.duration;document.querySelector('#status').textContent=`${id} / ${gltf.animations.length} clips / ${base}`;document.querySelector('#play').textContent='Play';}
function pose(time){action.paused=false;action.time=Math.min(selected.duration,time);mixer.update(0);gltf.scene.updateMatrixWorld(true);if(held)supportEquipment(gltf.scene,held.root,selected.id,time)}
function render(time){pose(time);renderer.setScissorTest(true);cameras.forEach((c,i)=>{renderer.setViewport(i*420,0,420,430);renderer.setScissor(i*420,0,420,430);renderer.render(scene,c)});renderer.setScissorTest(false);range.value=time;readout.value=time.toFixed(3)+' s';}
function capture(time,view=1){pose(time);renderer.setSize(420,430,false);renderer.setViewport(0,0,420,430);renderer.setScissorTest(false);renderer.render(scene,cameras[view]);const url=renderer.domElement.toDataURL();renderer.setSize(1260,430,false);return url}
async function sheet(){const phases=selected.motion?.phases?.length?selected.motion.phases:[{name:'start',frame:1},{name:'step',frame:Math.round(selected.duration*10)},{name:'middle',frame:Math.round(selected.duration*15)},{name:'return',frame:Math.round(selected.duration*23)},{name:'end',frame:Math.round(selected.duration*30)}];const el=document.querySelector('#sheet');el.replaceChildren();for(const phase of phases){const f=document.createElement('figure');f.className=phase.name==='contact'?'contact':'';const img=new Image();img.src=capture(phase.frame/30);f.append(img);const c=document.createElement('figcaption');c.textContent=phase.name+' / f'+phase.frame;f.append(c);el.append(f)}render(t)}
select.onchange=()=>{choose(select.value);sheet()};document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};range.oninput=()=>{playing=false;t=+range.value;document.querySelector('#play').textContent='Play';render(t)};document.querySelector('#frames').onclick=sheet;
choose('idle');await sheet();window.figureReview={equip,choose(id,time=0){select.value=id;choose(id);playing=false;t=time;render(t)},sheet,capture,play(){playing=true;document.querySelector('#play').textContent='Pause'},pause(){playing=false;document.querySelector('#play').textContent='Play'},get state(){return{clip:selected.id,time:t,playing}}};document.documentElement.dataset.ready='true';
function animate(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(playing){t=selected.loop?(t+dt)%selected.duration:Math.min(t+dt,selected.duration);if(!selected.loop&&t>=selected.duration){playing=false;document.querySelector('#play').textContent='Play'}}render(t);requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></html>
