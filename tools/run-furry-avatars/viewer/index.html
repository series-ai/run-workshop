<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anthro kit</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; background: #ecebf0; color: #222; }
  #app { display: flex; height: 100%; }
  #view { flex: 1; position: relative; }
  canvas { display: block; }
  aside { width: 320px; overflow-y: auto; padding: 16px; background: #fff; border-left: 1px solid #ddd; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #777; margin: 18px 0 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; gap: 8px; }
  .row label { flex: 1; }
  select { font: inherit; padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px; background: #f6f6f8; min-width: 150px; }
  input[type=range] { width: 150px; }
  .row output { width: 38px; text-align: right; color: #777; font-size: 12px; }
  input[type=color] { width: 44px; height: 26px; border: 1px solid #ccc; border-radius: 4px; padding: 0; background: none; cursor: pointer; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; padding: 5px 9px; border: 1px solid #ccc; border-radius: 6px; background: #f6f6f8; cursor: pointer; }
  button.on { background: #222; color: #fff; border-color: #222; }
  #status { position: absolute; left: 12px; bottom: 10px; color: #666; font-size: 12px; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels div { position: absolute; transform: translate(-50%, -100%); font-size: 11px; color: #555; background: rgba(255,255,255,.75); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three-build/three.module.js", "three/addons/": "./vendor/jsm/" } }

</head>
<body>
<div id="app">
  <div id="view"><div id="labels"></div><div id="status">Loading…</div></div>
  <aside>
    <h1>Anthro kit</h1>
    <div class="btns"><button id="lineup-btn">Lineup: every species</button></div>
    <h2>Species</h2>
    <div class="btns" id="species"></div>
    <h2>Parts</h2>
    <div id="parts"></div>
    <h2>Wearing</h2>
    <div class="btns" id="wear"></div>
    <h2>Look</h2>
    <div class="row"><label>Shader</label><select id="shader"></select></div>
    <div id="look"></div>
    <div class="btns" style="margin-top:6px"><button id="look-copy">Copy look link</button><button id="look-reset">Reset look</button></div>
    <h2>Animation</h2>
    <div class="btns" id="anims"></div>
    <div id="colours"></div>
  </aside>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || '../kit/anthro-kit-B.glb';
const CATALOGUE = params.get('catalogue') || '../kit/species.json';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xecebf0);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
const CAMS = { '34': [-2.2, 1.5, 3.6], side: [-4.2, 1.1, 0], front: [0, 1.2, 4.2], head: [-0.9, 1.75, 1.5], headside: [-1.6, 1.68, 0], headfront: [0, 1.7, 1.6], wide: [-6.5, 2.4, 1.5], sideup: [-5.0, 1.75, 0], '34up': [-2.6, 2.0, 4.2] };   // (*up: framed higher, for airborne poses)
camera.position.set(...(CAMS[params.get('cam')] || CAMS['34']));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, (params.get('cam') || '').startsWith('head') ? 1.65 : 1.0, 0);
controls.update();
const hemi = new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-2, 4, 3);
const rim = new THREE.DirectionalLight(0xffffff, 0);   // a back light: a bright edge on the far side of the shapes
rim.position.set(2, 3, -4);
scene.add(rim);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), new THREE.MeshLambertMaterial({ color: 0xdedce4 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
let coverMode = false;   // (declared before resize(): it runs at startup)
function resize() {
  if (coverMode) return;
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const GROUPS = {
  'Fur': ['fur', 'fur_light', 'fur_dark', 'inner_ear', 'pads'],
  'Hair': ['hair'],
  'Face': ['iris', 'eye_white', 'pupil', 'nose', 'mouth'],
  'Horn, beak, hoof': ['horn', 'claws'],
  'Clothes': ['cloth_top', 'cloth_top_trim', 'cloth_bottom', 'cloth_bottom_trim'],
};
const LABELS = { fur: 'Main fur', fur_light: 'Markings', fur_dark: 'Socks, gloves, brows', inner_ear: 'Inner ears', pads: 'Pads', hair: 'Hair',
  iris: 'Eyes', eye_white: 'Eye whites, teeth', pupil: 'Pupils', nose: 'Nose', mouth: 'Mouth and lids', claws: 'Claws', horn: 'Horn, beak, hooves',
  cloth_top: 'Hoodie', cloth_top_trim: 'Hoodie trim', cloth_bottom: 'Shorts', cloth_bottom_trim: 'Shorts pockets' };
const KINDS = ['head', 'ears', 'cheeks', 'hair', 'eyes', 'teeth', 'tail', 'feet'];
const teethObjs = {};   // style -> snout -> object: each teeth style is fitted to every snout, shown for the chosen head's snout

const status = document.getElementById('status');
addEventListener('error', (ev) => { status.textContent = 'ERR ' + ev.message; });
let root, cat, mats = {}, defaults = {}, bones = {}, rest = {}, mixer = null, clips = {};
const kit = {};       // kind -> name -> object
const chosen = {};    // kind -> name
const wear = {};      // toggleable extras: top, bottom, tuft, claws

// ---- shaders: one material per (shader, colour region), normals swapped per mesh, optional inverted-hull outline
const SHADERS = {
  flat:      { label: 'Flat',                normals: 'flat' },
  smooth:    { label: 'Smooth',              normals: 'smooth' },
  auto:      { label: 'Auto smooth (40°)',   normals: 'auto' },
  soft:      { label: 'Soft (PBR)',          normals: 'auto' },
  plush:     { label: 'Plush (fabric sheen)', normals: 'smooth' },
  toon:      { label: 'Toon',                normals: 'smooth' },
  toonline:  { label: 'Toon + outline (default)', normals: 'smooth', outline: true },
  toonflat:  { label: 'Toon flat',           normals: 'flat' },
  flatline:  { label: 'Flat + outline',      normals: 'flat', outline: true },
  unlit:     { label: 'Unlit (flat colour)', normals: 'flat' },
  unlitline: { label: 'Unlit + outline',     normals: 'flat', outline: true },
  celline:   { label: 'Cel 2-tone + outline',  normals: 'smooth', outline: true },
  celflat:   { label: 'Cel 2-tone flat + outline', normals: 'flat', outline: true },
  toonflatline: { label: 'Toon flat + outline', normals: 'flat', outline: true },
  softline:  { label: 'Soft (PBR) + outline', normals: 'auto', outline: true },
  rimline:   { label: 'Unlit + rim glow + outline', normals: 'smooth', outline: true },
};
// the look: everything adjustable from the panel (and ?look=<json>), shared by the editor, the lineup and the cover
const LOOK_DEFAULT = { outline: 0.0085, ink: 0.3, steps: 3, floor: 0.24, cel: 0.72, key: 2.2, keyAz: -35, keyEl: 50, fill: 1.6, rim: 0, rimGlow: 0.35, bg: '#ecebf0' };
const LOOK = Object.assign({}, LOOK_DEFAULT, JSON.parse(new URLSearchParams(location.search).get('look') || '{}'));
const U = { outline: { value: LOOK.outline }, rimGlow: { value: LOOK.rimGlow } };   // shared shader uniforms
const NO_OUTLINE = new Set(['iris', 'pupil', 'eye_white', 'mouth']);   // decals: a hull round them reads as noise
const outlineAll = [];                   // every outline material with its base colour (ink darkness updates them)
let shader = 'toonline';
const colours = {};                      // region -> THREE.Color, shared by every shader's material
const shaderMats = {};                   // shader -> region -> material
const outlineMats = {};                  // region -> material
const meshes = [];                       // { mesh, regions, geo: { flat, smooth, auto }, outline }
function ramp(values) {
  const t = new THREE.DataTexture(new Uint8Array(values.flatMap((v) => [v, v, v, 255])), values.length, 1);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
function toonValues() {   // `steps` bands from `floor` up to full brightness
  const n = Math.max(2, Math.round(LOOK.steps));
  return Array.from({ length: n }, (_, i) => Math.round(255 * (LOOK.floor + (1 - LOOK.floor) * i / (n - 1))));
}
const toonRamp = ramp(toonValues());
const celRamp = ramp([Math.round(255 * LOOK.cel), 255]);   // one hard shadow band, light everywhere else

function makeMat(kind, region, color = colours[region]) {
  let m;
  if (kind === 'flat' || kind === 'flatline') m = new THREE.MeshLambertMaterial({ color, flatShading: true });
  else if (kind === 'smooth' || kind === 'auto') m = new THREE.MeshLambertMaterial({ color });
  else if (kind === 'soft') m = new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0 });
  else if (kind === 'plush') m = new THREE.MeshPhysicalMaterial({ color, roughness: 0.95, metalness: 0, sheen: 1, sheenRoughness: 0.45, sheenColor: 0xffffff });
  else if (kind === 'toon' || kind === 'toonline') m = new THREE.MeshToonMaterial({ color, gradientMap: toonRamp });
  else if (kind === 'toonflat' || kind === 'toonflatline') m = new THREE.MeshToonMaterial({ color, gradientMap: toonRamp, flatShading: true });
  else if (kind === 'celline') m = new THREE.MeshToonMaterial({ color, gradientMap: celRamp });
  else if (kind === 'celflat') m = new THREE.MeshToonMaterial({ color, gradientMap: celRamp, flatShading: true });
  else if (kind === 'softline') m = new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0 });
  else if (kind === 'rimline') {   // flat colour plus a soft glow on the silhouette edge (fresnel), no lighting
    m = new THREE.MeshLambertMaterial({ color });
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uRimGlow = U.rimGlow;
      sh.fragmentShader = 'uniform float uRimGlow;\n' + sh.fragmentShader.replace('#include <opaque_fragment>', `
        float fres = pow(1.0 - abs(dot(normalize(vNormal), normalize(vViewPosition))), 3.0);
        outgoingLight = diffuseColor.rgb + uRimGlow * fres;
        #include <opaque_fragment>`);
    };
  }
  else m = new THREE.MeshBasicMaterial({ color });
  m.color = color;                       // share the Color object so the pickers drive every shader at once
  m.name = region;
  return m;
}
function getMat(kind, region) {
  shaderMats[kind] = shaderMats[kind] || {};
  return shaderMats[kind][region] || (shaderMats[kind][region] = makeMat(kind, region));
}
function getOutlineMat(region) {
  if (outlineMats[region]) return outlineMats[region];
  return (outlineMats[region] = makeOutlineMat(region, colours[region]));
}
function makeOutlineMat(region, color) {
  const m = new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(LOOK.ink), side: THREE.BackSide });
  m.name = region;
  m.onBeforeCompile = (sh) => {   // push the back faces out along the smoothed normal (bind space, before skinning)
    sh.uniforms.uOutline = U.outline;
    sh.vertexShader = 'uniform float uOutline;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>\n  transformed += normalize(normal) * uOutline;`);
  };
  outlineAll.push({ m, base: color });
  return m;
}

// welded normals: average the face normals of every corner at the same position, within the crease angle
function smoothGeometry(src, creaseDeg) {
  const g = (src.index ? src.toNonIndexed() : src.clone());
  const pos = g.attributes.position, n = pos.count;
  const face = new Float32Array(n * 3), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const buckets = new Map();
  const key = (i) => `${Math.round(pos.getX(i) * 1e4)},${Math.round(pos.getY(i) * 1e4)},${Math.round(pos.getZ(i) * 1e4)}`;
  for (let i = 0; i < n; i += 3) {
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
    const fn = c.sub(b).cross(a.sub(b));   // area-weighted
    for (let k = 0; k < 3; k++) {
      face.set([fn.x, fn.y, fn.z], (i + k) * 3);
      const h = key(i + k);
      if (!buckets.has(h)) buckets.set(h, []);
      buckets.get(h).push(i + k);
    }
  }
  const cos = Math.cos(creaseDeg * Math.PI / 180), out = new Float32Array(n * 3);
  const fi = new THREE.Vector3(), fj = new THREE.Vector3(), sum = new THREE.Vector3();
  for (const list of buckets.values()) {
    for (const i of list) {
      fi.fromArray(face, i * 3); const li = fi.length() || 1;
      sum.set(0, 0, 0);
      for (const j of list) {
        fj.fromArray(face, j * 3);
        if (fi.dot(fj) / (li * (fj.length() || 1)) >= cos) sum.add(fj);
      }
      sum.normalize().toArray(out, i * 3);
    }
  }
  g.setAttribute('normal', new THREE.BufferAttribute(out, 3));

}
function geometryFor(rec, kind) {
  if (!rec.geo[kind]) rec.geo[kind] = smoothGeometry(rec.geo.flat, kind === 'smooth' ? 180 : 40);
  return rec.geo[kind];
}
function setShader(kind) {
  if (!SHADERS[kind]) kind = 'flat';
  shader = kind;
  const S = SHADERS[kind];
  for (const rec of meshes) {
    const o = rec.mesh;
    o.geometry = S.normals === 'flat' ? rec.geo.flat : geometryFor(rec, S.normals);
    const list = rec.regions.map((r) => getMat(kind, r));
    o.material = Array.isArray(o.material) ? list : list[0];
    const wantLine = S.outline && (o.name.startsWith('teeth_') || !rec.regions.every((r) => NO_OUTLINE.has(r)));   // teeth share the eye-white colour but need the line to read on a pale muzzle
    if (wantLine && !rec.outline) {
      const g = geometryFor(rec, 'smooth');   // smooth normals keep the hull from splitting at hard edges
      const m = rec.regions.length > 1 ? rec.regions.map(getOutlineMat) : getOutlineMat(rec.regions[0]);
      const line = o.isSkinnedMesh ? new THREE.SkinnedMesh(g, m) : new THREE.Mesh(g, m);
      if (o.isSkinnedMesh) line.bind(o.skeleton, o.bindMatrix);
      line.frustumCulled = false;
      line.name = o.name + '__outline';
      o.add(line);
      rec.outline = line;
    }
    if (rec.outline) rec.outline.visible = !!wantLine;
  }
  const sel = document.getElementById('shader');
  if (sel) sel.value = kind;
  if (lineup) buildLineup();   // the lineup's per-species materials follow the shader
}

// ---- lineup: every species preset side by side, each a skeleton clone of the kit with its own parts and colours
let lineup = null;                       // { group, members: [{ sp, obj, mixer, actions, bones, label }] }
const labelsEl = document.getElementById('labels');
const savedCam = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
// lineup outfits: species recipes don't set clothes, so give each character its own hoodie/shorts pair rather than a wall of one colour
const OUTFITS = [['#2f6fd6', '#f2c14e'], ['#e0533d', '#2b2d42'], ['#3aa17e', '#f4f1de'], ['#8e5cd9', '#ffd166'], ['#f28c28', '#264653'],
  ['#d94f8a', '#3d405b'], ['#2a9d8f', '#e9c46a'], ['#5a6b7d', '#ef476f'], ['#f6bd60', '#2d3047'], ['#4361ee', '#ff9f1c'], ['#9c6644', '#e5e5e5']];
function speciesColour(sp, region) {
  const i = Object.keys(cat.species).indexOf(sp), o = OUTFITS[i % OUTFITS.length];
  if (region === 'cloth_top' || region === 'cloth_bottom_trim') return new THREE.Color(o[0]);
  if (region === 'cloth_bottom' || region === 'cloth_top_trim') return new THREE.Color(o[1]);
  const r = (cat.species[sp].colours || {})[region];
  return new THREE.Color(r || defaults[region]);
}
function buildLineup(cast = null) {
  // cast (the cover): [{ sp, x, z, ry, clip, t }] places species with a fixed pose each; default: every species in rows
  clearLineup();
  const names = cast ? cast.map((c) => c.sp) : Object.keys(cat.species);
  const group = new THREE.Group();
  const members = [];
  const rows = 3, perRow = Math.ceil(names.length / rows), dx = 1.0, dz = 1.5;
  names.forEach((sp, i) => {
    const r = cat.species[sp];
    const obj = SkeletonUtils.clone(root);
    const row = Math.floor(i / perRow), col = i % perRow;
    const n = Math.min(perRow, names.length - row * perRow);
    obj.position.set((col - (n - 1) / 2) * dx + (row % 2 ? dx * 0.5 : 0), 0, -row * dz);   // odd rows staggered so they show between
    const cc = cast && cast[i];
    if (cc) { obj.position.set(cc.x, cc.y || 0, cc.z); obj.rotation.y = cc.ry || 0; }
    obj.userData.species = sp;
    const mats = {}, lines = {};
    obj.traverse((o) => {
      const m = /^(head|ears|cheeks|hair|eyes|tail|feet)_([a-z_]+)$/.exec(o.name);
      if (m && !/_\d+$/.test(o.name)) o.visible = m[2] === (r[m[1]] || 'none');
      if (o.name === 'claws_paws') o.visible = clawsOn && (r.feet || 'paws') === 'paws';
      if (o.name === 'tuft') o.visible = r.tuft !== false;
      const tm = /^teeth_([a-z]+)__([a-z]+)$/.exec(o.name);
      if (tm) o.visible = tm[1] === r.teeth && tm[2] === r.snout;
      if (!o.isMesh) return;
      const outline = o.name.endsWith('__outline');
      const list = (Array.isArray(o.material) ? o.material : [o.material]).map((mt) => {
        const region = mt.name;
        if (outline) return lines[region] || (lines[region] = makeOutlineMat(region, speciesColour(sp, region)));
        return mats[region] || (mats[region] = makeMat(shader, region, speciesColour(sp, region)));
      });
      o.material = Array.isArray(o.material) ? list : list[0];
      o.frustumCulled = false;
    });
    const mixer = new THREE.AnimationMixer(obj);
    const actions = {};
    for (const [name, a] of Object.entries(clips)) { actions[name] = mixer.clipAction(a.getClip()); actions[name].play(); actions[name].enabled = false; }
    const bonesC = {};
    obj.traverse((o) => { if (o.isBone) bonesC[o.name] = o; });
    const label = document.createElement('div');
    label.textContent = sp;
    labelsEl.appendChild(label);
    group.add(obj);
    members.push({ sp, obj, mixer, actions, bones: bonesC, label, offset: i * 0.137, clip: cc ? cc.clip : null, at: cc ? cc.t : null });
  });
  scene.add(group);
  lineup = { group, members, halfW: (perRow * dx) / 2 + 0.3, depth: (rows - 1) * dz };
  root.visible = false;
  ground.visible = false;
}
function clearLineup() {
  if (!lineup) return;
  scene.remove(lineup.group);
  lineup.group.traverse((o) => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose()); });
  labelsEl.innerHTML = '';
  lineup = null;
}
function setLineup(on) {
  document.getElementById('lineup-btn').classList.toggle('on', on);
  if (on && !lineup) {
    savedCam.pos.copy(camera.position); savedCam.target.copy(controls.target);
    buildLineup();
    // fit the front row's width in view from a low 3/4
    const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
    const dist = lineup.halfW / Math.tan(hfov / 2) + lineup.depth / 2 + 1.2;   // the front row is nearer than the target
    const tgt = new THREE.Vector3(0, 0.9, -lineup.depth / 2);
    controls.target.copy(tgt);
    camera.position.copy(tgt).add(new THREE.Vector3(-0.18, 0.3, 1).normalize().multiplyScalar(dist));
  } else if (!on && lineup) {
    clearLineup();
    root.visible = true; ground.visible = true;
    camera.position.copy(savedCam.pos); controls.target.copy(savedCam.target);
  }
  controls.update();
}
// click a character in the lineup to open it in the editor
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
let hovered = null;   // names show on hover (a label over every head crowds the rows behind)
renderer.domElement.addEventListener('pointermove', (e) => {
  hovered = lineup ? pick(e) : null;
  renderer.domElement.style.cursor = hovered ? 'pointer' : '';
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!lineup || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const best = pick(e);
  if (best) { setLineup(false); hovered = null; renderer.domElement.style.cursor = ''; applySpecies(best.sp); }
});
function pick(e) {
  const rc = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  // pick by nearest character to the ray (skinned raycasts are costly and the parts overlap): the ray's closest approach to each body axis
  let best = null, bestD = 0.45;
  const p = new THREE.Vector3();
  for (const m of lineup.members) {
    for (const h of [0.5, 1.0, 1.5]) {
      p.copy(m.obj.position).setY(h);
      const d = ray.ray.distanceToPoint(p);
      if (d < bestD) { bestD = d; best = m; }
    }
  }
  return best;
}

let clawsOn = true;
function syncClaws() {   // finger claws follow the toggle; toe claws also need paws (hooves, talons and reptile feet bring their own)
  if (wear.claws) wear.claws.visible = clawsOn;
  if (wear.claws_paws) wear.claws_paws.visible = clawsOn && chosen.feet === 'paws';
}
function choose(kind, name) {
  chosen[kind] = name;
  for (const [n, o] of Object.entries(kit[kind] || {})) o.visible = n === name;
  syncClaws();
  syncTeeth();
  const sel = document.querySelector(`select[data-kind="${kind}"]`);
  if (sel) sel.value = name;
}
function syncTeeth() {
  const sn = cat && cat.species[chosen.head] ? cat.species[chosen.head].snout : null;
  for (const [st, bySnout] of Object.entries(teethObjs)) for (const [s2, o] of Object.entries(bySnout)) o.visible = st === chosen.teeth && s2 === sn;

function setColour(name, hex) {

    for (const a of Object.values(clips)) a.enabled = a === baked;
    stool.visible = !lineup && /^sit_(idle|type|eat|talk)$/.test(BAKED[anim] || '');
    if (baked) { const tt = t % baked.getClip().duration; mixer.setTime(tt); updateTrails(BAKED[anim], tt, baked); }   // (the mixer only writes values that changed since its last frame)
    else {
      trails.forEach((m) => { m.visible = false; });
      for (const [name, b] of Object.entries(bones)) { b.quaternion.copy(rest[name]); if (name === 'root') b.position.set(0, 0, 0); }
    }
    if (lineup) {
      const rc = renderer.domElement.getBoundingClientRect(), v = new THREE.Vector3();
      for (const m of lineup.members) {
        const cn = m.clip || BAKED[anim];
        for (const [name, a] of Object.entries(m.actions)) a.enabled = name === cn;
        const act = m.actions[cn];
        if (act) m.mixer.setTime(m.at !== null ? m.at : (t + m.offset) % act.getClip().duration);
        else for (const [name, b] of Object.entries(m.bones)) { if (rest[name]) b.quaternion.copy(rest[name]); if (name === 'root') b.position.set(0, 0, 0); }
        v.copy(m.obj.position).setY(2.02).project(camera);   // above the head, so back-row names don't land on the front row
        m.label.style.left = ((v.x + 1) / 2 * rc.width) + 'px';
        m.label.style.top = ((1 - v.y) / 2 * rc.height) + 'px';
        m.label.style.display = m === hovered ? '' : 'none';
      }
    }
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
