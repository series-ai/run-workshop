  canvas#out { height: 100vh; aspect-ratio: 9 / 16; display: block; }
</style>
<style>
  /* Creepster by Font Diner (SIL Open Font License 1.1, see fonts/Creepster-OFL.txt), loaded locally */
  @font-face { font-family: "Creepster"; src: url("fonts/Creepster-Regular.ttf") format("truetype"); font-display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "../previewer/vendor/three-build/three.module.js", "three/addons/": "../previewer/vendor/jsm/" } }
</script>

<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
// Boo Brigade: the trailer, choreographed shot by shot with the real costume-kid
// GLBs and clips, the dusk street (from previewer/street.js) and the live house
// parts kit (from previewer/houses.js).
//   live:              plays in real time and loops
//   ?at=12.5&save=1    a full-size still at that time, posted to promo/server.py
//   ?sheet=1,4,9&save=1  a contact sheet of moments
//   ?record=1          steps exactly 1/30 s per frame, posts every frame and the
//                      sound cues to promo/server.py
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as skinnedClone } from "three/addons/utils/SkeletonUtils.js";

const Q = new URLSearchParams(location.search);
const W = 1080, H = 1920, FPS = 30;
const RECORD = Q.has("record");
const TITLE = Q.get("title") || "BOO BRIGADE";
const FONT = `"Creepster", Impact, sans-serif`;
const BPM = 140, BEAT = 60 / BPM, BAR = 4 * BEAT;   // every cut and pop lands on this grid
const A = "../previewer/";

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const gl = renderer.domElement;
const out = document.getElementById("out");
const ctx = out.getContext("2d");
const camera = new THREE.PerspectiveCamera(30, W / H, 0.3, 900);

// ------------------------------------------------------------------ the kids' look
// The kids read at dusk but sit in the mood of the scene. ?look=toon (default): a soft
// five-step toon ramp on the kids (no pure-white top step), a warm lamp-coloured light from the
// camera, a small cool blue-purple self-light (the dusk ambient) and a cool grade on the kids
// only; the street gets the moodier settings, the stage close-ups a lighter touch. Each knob is
// a query param for comparing variants (ramp, lift/liftc/grade/fill/fillc for the street,
// slift/sliftc/sgrade/sfill/sfillc for the stage). ?look=fill: the original shading plus the
// camera light. ?look=plain: draft 1.
const LOOK = Q.get("look") || "toon";
const RAMP = (Q.get("ramp") || "105,150,185,215,235").split(",").map(Number);
const TOON_RAMP = (() => {
  const t = new THREE.DataTexture(new Uint8Array(RAMP), RAMP.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();
const hexC = (q, d) => new THREE.Color(+("0x" + (Q.get(q) || d)));
// per scene, set before each render: a self-light (tinted) and a grade multiplied over the kids' lit colour
const kidLift = { value: new THREE.Color() }, kidGrade = { value: new THREE.Color(1, 1, 1) };
const LIFT = { street: +(Q.get("lift") ?? 0.2), stage: +(Q.get("slift") ?? 0.08) };
const LIFT_C = { street: hexC("liftc", "aaa6ff"), stage: hexC("sliftc", "d0ccff") };
const GRADE = { street: hexC("grade", "eee8ff"), stage: hexC("sgrade", "f6f2ff") };
const FILL = { street: +(Q.get("fill") ?? 0.42), stage: +(Q.get("sfill") ?? 0.45) };
const FILL_C = { street: hexC("fillc", "ffcc98"), stage: hexC("sfillc", "fff1e2") };
function liftShader(sh) {
  sh.uniforms.kidLift = kidLift;
  sh.uniforms.kidGrade = kidGrade;
  sh.fragmentShader = "uniform vec3 kidLift;\nuniform vec3 kidGrade;\n" + sh.fragmentShader.replace("#include <opaque_fragment>",
    "outgoingLight = outgoingLight * kidGrade + diffuseColor.rgb * kidLift;\n#include <opaque_fragment>");
}
function kidMaterial(m) {
  if (LOOK === "plain") return m;
  const k = LOOK === "toon"
    ? new THREE.MeshToonMaterial({ name: m.name, color: m.color.clone(), vertexColors: m.vertexColors, gradientMap: TOON_RAMP, side: m.side })
    : m.clone();
  if (LOOK === "toon") k.onBeforeCompile = liftShader;
  return k;
}

// a seeded random, so a recording is the same every time
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const lerp = (a, b, u) => a + (b - a) * u;
const clamp01 = u => Math.max(0, Math.min(1, u));
const smooth = u => { u = clamp01(u); return u * u * (3 - 2 * u); };
const easeOut = u => 1 - (1 - clamp01(u)) ** 3;
const easeOutBack = u => { u = clamp01(u); const c = 1.7; return 1 + (c + 1) * (u - 1) ** 3 + c * (u - 1) ** 2; };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

let T = 0, events = [];
// a sound cue at an exact time (default: now). Cues tied to the music go through sfxB, which puts
// them exactly on the beat grid of the current shot (every shot starts on a bar line).
const sfx = (type, gain = 1, at = T, extra = {}) => events.push({ t: +at.toFixed(4), type, gain, ...extra });
const sfxB = (type, gain, beat, extra) => sfx(type, gain, STARTS[shotIx] + beat * BEAT, extra);
const titlePops = (b0, n, gain) => { for (let i = 0; i < n; i++) sfxB("pop", gain, b0 + i / 8, { pitch: i }); };

const loader = new GLTFLoader();
const cache = new Map();
const load = url => { if (!cache.has(url)) cache.set(url, loader.loadAsync(url)); return cache.get(url); };

function gradientTexture(stops, extra) {
  const c = document.createElement("canvas");
  c.width = 270; c.height = 480;
  const g = c.getContext("2d"), grad = g.createLinearGradient(0, 0, 0, 480);
  for (const [t, col] of stops) grad.addColorStop(t, col);
  g.fillStyle = grad; g.fillRect(0, 0, 270, 480);
  if (extra) extra(g);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ------------------------------------------------------------------ kids
const SKIN_TONES = [[0.99, 0.86, 0.74], [0.95, 0.78, 0.62], [0.88, 0.66, 0.48], [0.74, 0.50, 0.32], [0.56, 0.35, 0.21], [0.38, 0.23, 0.14]];
const KSRC = new Map();
const KIDS = [];        // every kid made, so one loop updates their mixers
function makeKid(slug, { scale = 1, skin = 1, parent } = {}) {
  const g = KSRC.get(slug);
  const obj = skinnedClone(g.scene);
  obj.scale.setScalar(scale);
  const k = { slug, obj, skinMats: [], expr: {}, face: null, clip: null, current: null, path: [], x: 0, y: 0, z: 0, yaw: 0 };
  obj.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
      const mats = [o.material].flat().map(m => {
        if (!m.name.startsWith("SKIN")) return m;
        const c = m.clone();
        c.onBeforeCompile = m.onBeforeCompile;
        return c;
      });
      o.material = Array.isArray(o.material) ? mats : mats[0];
      for (const m of mats) if (m.name.startsWith("SKIN")) k.skinMats.push(m);
    }
    const nm = o.userData.name || o.name;   // GLTFLoader strips the dots from node names; the original is kept here
    if (nm && nm.startsWith("expr.")) k.expr[nm] = o;
  });
  if (!g.foot) {   // the bind-pose footprint (half width across, half depth front to back), for spacing
    const b = new THREE.Box3();
    g.scene.traverse(o => { if (o.isMesh) { o.geometry.computeBoundingBox(); b.union(o.geometry.boundingBox); } });
    g.foot = [Math.max(-b.min.x, b.max.x), Math.max(-b.min.z, b.max.z)];
  }
  k.hw = g.foot[0] * scale; k.hd = g.foot[1] * scale;
  k.mixer = new THREE.AnimationMixer(obj);
  k.actions = Object.fromEntries(g.animations.map(c => [c.name, k.mixer.clipAction(c)]));
  setSkin(k, skin);
  parent.add(obj);
  KIDS.push(k);
  return k;
}
function setSkin(k, i) {
  const [r, g, b] = SKIN_TONES[i];
  for (const m of k.skinMats) m.color.setRGB(r, g, b, THREE.SRGBColorSpace);
}
function play(k, name, { ts = 1, at = 0, once = false, fade = 0, force = false } = {}) {
  if (k.clip === name && !force) { if (k.current) k.current.timeScale = ts; return; }
  const next = k.actions[name] || k.actions.idle;
  if (fade > 0 && k.current && k.current !== next) {
    next.reset();
    next.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
    next.clampWhenFinished = true;
    next.fadeIn(fade).play();
    k.current.fadeOut(fade);
  } else {
    k.mixer.stopAllAction();
    next.reset();
    next.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
    next.clampWhenFinished = true;
    next.play();
  }
  next.time = at;
  next.timeScale = ts;
  k.current = next;
  k.clip = name;
}
// expressions: each expr.<group>.<name> node is shown at scale 1 or hidden at 0. A face
// override ({ eyes, brow, mouth }; "none" hides the group) is applied after the clip.
function applyFace(k) {
  if (!k.face) return;
  for (const [name, node] of Object.entries(k.expr)) {
    const [, group, val] = name.split(".");
    const want = k.face[group];
    if (want === undefined) continue;
    node.scale.setScalar(want === val ? 1 : 0);
  }
}
function place3(k, x, y, z, yaw) {
  k.x = x; k.y = y; k.z = z; k.yaw = yaw;
  k.obj.position.set(x, y, z);
  k.obj.rotation.y = yaw;
}
const show = (list, on) => { for (const k of list) k.obj.visible = on; };

// ================================================================== the street
// Adapted from previewer/street.js: the same layout, instancing, light pools, candy
// and kid packs, on a fixed timestep with a seeded random.
const STREET = new THREE.Scene();
const LOT = 24, LOTS = 6, X0 = -(LOT * LOTS) / 2, X1 = -X0;
const FENCE_Z = 11.6, WALK_Z0 = 12, ROAD_Z1 = 24;
const WALK_Y = 0.38, GRASS_Y = 0.37;
const HOUSE_Z = -3;
const LANES = [12.8, 14.0];                 // as previewer/street.js: kids on the inner sidewalk,
const KERB_Z = 15.8, FURNITURE_Z = 15.55;  // lamps on the kerb edge, hydrants and the sign just inside
const HOUSES = [
  { slug: "house-a", fence: "white" }, { slug: "house-06", fence: "dark" }, { slug: "house-b", fence: "white" },
  { slug: "house-07", fence: "white" }, { slug: "house-c", fence: "dark" }, { slug: "house-10", fence: "white" },
];
const SIM_KIDS = ["witch", "cupcake", "cardboard-robot", "knight", "ghost", "pumpkin-clown", "dracula", "princess", "superhero",
  "mummy", "skeleton-onesie", "black-cat", "frankenstein", "wizard", "bumblebee", "ninja", "candy-corn", "inflatable-trex"];
const CANDY = ["candy-wrapped", "candy-lollipop", "candy-corn", "candy-chocolate", "candy-gumdrop", "candy-apple"];

const shemi = new THREE.HemisphereLight(0x8a86c8, 0x3a3048, 1.25);
const ssun = new THREE.DirectionalLight(0xff9a55, 1.5);
ssun.castShadow = true;
ssun.shadow.mapSize.set(2048, 2048);
ssun.shadow.bias = -0.0006;
ssun.shadow.normalBias = 0.04;
const sfill = new THREE.DirectionalLight(0xb9a8ff, 0.55);   // a soft front fill so faces read at dusk
sfill.position.set(30, 40, 90);
STREET.add(shemi, ssun, ssun.target, sfill);
const camFill = { street: new THREE.DirectionalLight(FILL_C.street, LOOK === "plain" ? 0 : FILL.street),
  stage: new THREE.DirectionalLight(FILL_C.stage, LOOK === "plain" ? 0 : FILL.stage) };
STREET.add(camFill.street, camFill.street.target);
function aimFill(scene, look) {   // a light from just above the camera, so every face reads
  const l = scene === STREET ? camFill.street : camFill.stage;
  l.position.copy(camera.position).add(V3(0, 2, 0));
  l.target.position.copy(look);
  l.target.updateMatrixWorld();
  const st = scene === STREET ? "street" : "stage";
  kidLift.value.copy(LIFT_C[st]).multiplyScalar(LOOK === "toon" ? LIFT[st] : 0);
  kidGrade.value.copy(LOOK === "toon" ? GRADE[st] : new THREE.Color(1, 1, 1));
}
STREET.background = gradientTexture([[0, "#24244f"], [0.45, "#43407a"], [0.75, "#8a5f86"], [1, "#e0905f"]]);
STREET.fog = new THREE.Fog(0x55467a, 160, 420);
function aimSun(cx, cz, half = 95) {   // keep the shadow map tight around what the camera sees
  ssun.target.position.set(cx, 0, cz);
  ssun.position.set(cx - 60, 40, cz - 40);
  Object.assign(ssun.shadow.camera, { left: -half, right: half, top: half * 0.65, bottom: -half * 0.65, near: 1, far: 400 });
  ssun.shadow.camera.updateProjectionMatrix();
}
aimSun(0, 0);

const grassMat = new THREE.MeshStandardMaterial({ color: 0x4f6e38, roughness: 1 });
function plane(w, d, x, y, z, mat, parent = STREET) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
plane(400, 200, 0, GRASS_Y, WALK_Z0 - 100, grassMat);
plane(400, 120, 0, GRASS_Y, ROAD_Z1 + 4 + 60, grassMat);
plane(1200, 1200, 0, -0.05, 0, new THREE.MeshStandardMaterial({ color: 0x4a5434, roughness: 1 }));

const glowMats = new Set();
async function propParts(slug) {
  const g = await load(`${A}street-assets/${slug}.glb`);
  g.scene.updateMatrixWorld(true);
  const parts = [];
  g.scene.traverse(o => {
    if (!o.isMesh) return;
    const geo = o.geometry.clone().applyMatrix4(o.matrixWorld);
    const mat = o.material;
    if (mat.name === "GLOW") { glowMats.add(mat); mat.userData.base ??= mat.emissiveIntensity; }
    parts.push({ geo, mat });
  });
  return parts;
}
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
function matrixOf(t) {
  _q.setFromEuler(_e.set(t.rx || 0, t.ry || 0, t.rz || 0));
  const s = t.s ?? 1;
  _s.set(t.sx ?? s, t.sy ?? s, t.sz ?? s);
  return _m.compose(_p.set(t.x, t.y ?? GRASS_Y, t.z), _q, _s);
}
const placements = new Map();
const place = (slug, t) => { if (!placements.has(slug)) placements.set(slug, []); placements.get(slug).push(t); };
const instanced = new Map();
async function buildInstances() {
  for (const [slug, list] of placements) {
    const parts = await propParts(slug);
    instanced.set(slug, parts.map(({ geo, mat }) => {
      const im = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach((t, i) => im.setMatrixAt(i, matrixOf(t)));
      im.castShadow = !slug.startsWith("road") && !slug.startsWith("sidewalk");
      im.receiveShadow = true;
      im.computeBoundingSphere();
      im.frustumCulled = false;
      STREET.add(im);
      return im;
    }));
  }
}

const ray = new THREE.Raycaster();
async function houseInfo(slug) {
  const parts = await propParts(slug);
  const pal = parts.find(p => p.mat.name !== "GLOW");
  const glowMat = parts.find(p => p.mat.name === "GLOW")?.mat;
  const pos = pal.geo.getAttribute("position");
  let maxZ = -Infinity;
  for (let i = 0; i < pos.count; i++) maxZ = Math.max(maxZ, pos.getZ(i));
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < pos.count; i++) if (pos.getZ(i) > maxZ - 0.3 && pos.getY(i) < 1) { lo = Math.min(lo, pos.getX(i)); hi = Math.max(hi, pos.getX(i)); }
  const doorX = (lo + hi) / 2;
  const meshes = parts.map(p => new THREE.Mesh(p.geo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide })));
  const prof = [];
  let deck = 0;
  for (let z = maxZ + 0.6; z > maxZ - 9; z -= 0.2) {
    ray.set(new THREE.Vector3(doorX, 5.2, z), new THREE.Vector3(0, -1, 0));
    const hit = ray.intersectObjects(meshes, false)[0];
    const y = hit ? 5.2 - hit.distance : 0;
    if (y - deck > 0.6) break;
    prof.push({ z, y });
    deck = Math.max(deck, y);
  }
  ray.set(new THREE.Vector3(doorX, deck + 1.6, maxZ + 1), new THREE.Vector3(0, 0, -1));
  const wall = ray.intersectObjects(meshes, false)[0];
  const doorZ = wall ? maxZ + 1 - wall.distance : maxZ - 4;
  return { doorX, maxZ, deck, doorZ, glowMat, prof: prof.filter(p => p.z > doorZ) };
}
function profileY(h, zLocal) {
  const p = h.info.prof;
  if (zLocal >= p[0].z) return 0;
  for (let i = 1; i < p.length; i++) if (p[i].z <= zLocal) return Math.max(p[i - 1].y, p[i].y);
  return p[p.length - 1].y;
}

const houses = [];
async function layout() {
  const infos = await Promise.all(HOUSES.map(h => houseInfo(h.slug)));
  HOUSES.forEach((h, i) => {
    const x0 = X0 + i * LOT, gateX = x0 + 10, info = infos[i];
    const hx = gateX - info.doorX;
    houses.push({ ...h, info, x0, gateX, hx });
    place(h.slug, { x: hx, z: HOUSE_Z });
    for (let k = 0; k < 6; k++) {
      const cx = x0 + 2 + 4 * k;
      if (k === 2) {
        place(`fence-${h.fence}-post`, { x: cx - 1.9, z: FENCE_Z });
        place(`fence-${h.fence}-post`, { x: cx + 1.9, z: FENCE_Z });
      } else place(`fence-${h.fence}`, { x: cx, z: FENCE_Z });
    }
    const z0 = HOUSE_Z + info.maxZ, len = FENCE_Z - z0;
    place("sidewalk", { x: gateX, y: GRASS_Y - 0.07, z: z0 + len / 2, sx: 0.72, sy: 0.25, sz: len / 4 });
    const dz = HOUSE_Z + info.doorZ;
    place(i % 2 ? "jack-small" : "jack-medium", { x: gateX + 2.3, y: GRASS_Y + info.deck, z: dz + 1.1, ry: -0.3 + rnd() * 0.6, s: 0.8 });
    place(["jack-medium", "jack-large", "jack-small"][i % 3], { x: gateX - 3.0, z: z0 + 1.2, ry: 0.4 - rnd() * 0.5 });
    place(i % 2 ? "hedge" : "bush", { x: hx + (info.doorX > 0 ? -4.5 : 4.5), z: HOUSE_Z + info.maxZ - 3.4, ry: (rnd() - 0.5) * 0.4 });
  });
  place("fence-white-post", { x: X1, z: FENCE_Z });
  place("fence-white-post", { x: X0 - 0.01, z: FENCE_Z });
  const L = i => X0 + i * LOT;
  place("mailbox", { x: L(0) + 6.5, z: FENCE_Z - 1.0 });
  place("leaf-pile", { x: L(0) + 18.5, z: 8.2, ry: 0.4 });
  place("tombstone-round", { x: L(1) + 3.6, z: 8.6, ry: 0.15 });
  place("tombstone-cross", { x: L(1) + 6.6, z: 7.4, ry: -0.2 });
  place("tombstone-round", { x: L(1) + 19.5, z: 8.8, ry: -0.25, s: 0.85 });
  place("crow-post", { x: L(1) + 22.6, z: 9.8, ry: -0.6 });
  place("hay-bale", { x: L(2) + 18, z: 8.4, ry: -0.25 });
  place("mailbox", { x: L(2) + 6.5, z: FENCE_Z - 1.0 });
  place("leaf-pile", { x: L(3) + 4.6, z: 8.6, ry: -0.5, s: 0.9 });
  place("mailbox", { x: L(3) + 13.5, z: FENCE_Z - 1.0 });
  place("tombstone-cross", { x: L(4) + 17.0, z: 8.2, ry: 0.3 });
  place("tombstone-round", { x: L(4) + 20.2, z: 7.4, ry: -0.1 });
  place("crow-post", { x: L(4) + 4.0, z: 9.6, ry: 0.5 });
  place("hay-bale", { x: L(5) + 4.4, z: 8.4, ry: 0.3 });
  place("leaf-pile", { x: L(5) + 19, z: 8.4, ry: 1.1 });
  place("hydrant", { x: L(1) + 15, y: WALK_Y, z: FURNITURE_Z });
  place("hydrant", { x: L(4) + 6, y: WALK_Y, z: FURNITURE_Z });
  place("street-sign", { x: X1 - 1.5, y: WALK_Y, z: FURNITURE_Z, ry: -0.3 });
  const TREES = ["tree-gnarled", "tree-leaning", "tree-forked"];
  for (let i = 0; i <= LOTS; i++) place(TREES[i % 3], { x: X0 + i * LOT + (rnd() - 0.5) * 2, z: 5 + rnd() * 3, ry: rnd() * 6.28, s: 0.85 + rnd() * 0.2 });
  for (let i = 0; i < LOTS; i++) place(TREES[(i + 1) % 3], { x: X0 + i * LOT + 14 + rnd() * 6, z: -16 - rnd() * 4, ry: rnd() * 6.28, s: 0.9 + rnd() * 0.2 });
  for (let i = 0; i <= LOTS; i++) place(i % 3 === 1 ? "lamp-double" : "lamp-single", { x: X0 + i * LOT + 4, y: WALK_Y, z: KERB_Z });
  for (let x = X0 - 24 + 2; x < X1 + 24; x += 4) {
    place("sidewalk", { x, y: 0, z: 14 });
    place("sidewalk", { x, y: 0, z: 26, ry: Math.PI });
  }
  for (let x = X0 - 24 + 8; x < X1 + 24; x += 16) place("road", { x, y: 0, z: 20, ry: Math.PI / 2 });
  place("car-sedan", { x: X0 + 40, y: 0, z: 18.1, ry: Math.PI / 2 });
  place("car-wagon", { x: X0 + 88, y: 0, z: 18.1, ry: Math.PI / 2 });
  place("car-bug", { x: X0 + 128, y: 0, z: 18.1, ry: -Math.PI / 2 });   // (street.js: X0 + 136; here nudged so it frames the patrol shot without hiding the kids)
}

// fake light pools under the lamps and at the gates (an additive glow: UI-like light, not an asset)
function buildPools() {
  const c = document.createElement("canvas");

// Adapted from previewer/houses.js: the same rules, part loading and palette recolouring;

let HM = null;
const matchCond = (cond, spec) => Object.entries(cond).every(([k, vals]) => vals.includes(spec[k]));
function partsFor(spec) {
  const out = [];

    if (p.when.some(c => matchCond(c, spec))) out.push({ def: p, mirror: false });
    if (p.when_mirror && p.when_mirror.some(c => matchCond(c, spec))) out.push({ def: p, mirror: true });

const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

function roleOf(r, g, b) {
  const s = [r, g, b].map(c => Math.pow(Math.max(c, 0), 1 / 2.2));
  let best = -1, bd = 0.02;
  HM.roles.table.forEach((e, i) => {
    const d = Math.max(...e.srgb.map((v, j) => Math.abs(v - s[j])));

async function loadPart(file) {

    if (!o.isMesh) return;
    const src = o.geometry.clone().applyMatrix4(o.matrixWorld);
    const geo = new THREE.BufferGeometry();
    geo.setIndex(src.index);
    geo.setAttribute("position", src.getAttribute("position"));
    geo.setAttribute("normal", src.getAttribute("normal"));
    const isGlow = o.material.name === "GLOW";
    if (!isGlow) {

        base[i * 3] = col.getX(i); base[i * 3 + 1] = col.getY(i); base[i * 3 + 2] = col.getZ(i);
        role[i] = roleOf(base[i * 3], base[i * 3 + 1], base[i * 3 + 2]);

}

  const P = Object.fromEntries(ROLES.map(r => [r, hexRGB(colours[r])])), { base, role } = geo.userData;
  const n = role.length;

  for (let i = 0; i < n; i++) {
    if (role[i] < 0) { col.array.set(base.subarray(i * 3, i * 3 + 3), i * 3); continue; }
    const e = HM.roles.table[role[i]], c = P[e.role];

  { label: "TURRET", slots: ["turret"] },
  { label: "WING", slots: ["wing", "wing-siding", "wing-gable", "wing-gable-window", "wing-side-window"] },
  { label: "TRIMMINGS", slots: ["chimney", "dormer", "bay", "boxes", "balcony", "balcony-rail"] },

  g.lineWidth = size * 0.22; g.strokeStyle = INK; g.strokeText(ch, cx, cy);
  const grad = g.createLinearGradient(0, cy - size * 0.5, 0, cy + size * 0.5);
  grad.addColorStop(0, hi); grad.addColorStop(0.35, fill); grad.addColorStop(1, fill);
  g.fillStyle = grad; g.fillText(ch, cx, cy);
  return glyph;
}
function balloon(text, yFrac, size, lt, { stagger = 0.045, ci0 = 0, out = Infinity } = {}) {
  if (lt <= 0) return;
  const lines = text.split("|");
  ctx.font = `${size}px ${FONT}`;
  let n = 0;
  const fade = clamp01((out - lt) / 0.12);
  if (fade <= 0) return;
  lines.forEach((line, li) => {
    const lc = LINE_COLS[(ci0 + li) % LINE_COLS.length];
    const widths = [...line].map(c => ctx.measureText(c).width + size * 0.06);
    const total = widths.reduce((a, b) => a + b, 0);
    let x = W / 2 - total / 2;
    const y = H * yFrac + (li - (lines.length - 1) / 2) * size * 1.02;
    [...line].forEach((c, i) => {
      const u = (lt - n * stagger) / 0.3;
      const cx = x + widths[i] / 2;
      x += widths[i];
      n++;
      if (c === " " || u <= 0) return;
      const s = easeOutBack(u) * fade;
      const bob = Math.sin(lt * 2 * Math.PI / (BEAT * 2) + n * 0.7) * size * 0.04;
      const tilt = Math.sin(n * 2.3) * 0.08;
      const g = balloonLetter(c, size, colourOf(c, lc));
      ctx.save();
      ctx.translate(cx, y + bob);
      ctx.rotate(tilt);
      ctx.scale(s, s);
      ctx.drawImage(g, -g.width / 2, -g.height / 2);
      ctx.restore();
    });
  });
}
function balloonWord(text, x, y, size, lt, col = "green", life = 1.6) {   // a popping word at a point (BOO!)
  if (lt <= 0 || lt > life) return;
  const s = easeOutBack(lt / 0.18) * (lt > life - 0.25 ? (life - lt) / 0.25 : 1);
  ctx.save();
  ctx.translate(x, y - lt * 30);
  ctx.rotate(-0.1);
  ctx.scale(s, s);
  ctx.font = `${size}px ${FONT}`;
  const widths = [...text].map(c => ctx.measureText(c).width + size * 0.06);
  let off = -widths.reduce((a, b) => a + b, 0) / 2;
  [...text].forEach((c, i) => {
    const g = balloonLetter(c, size, colourOf(c, col));
    const jig = Math.sin(lt * 30 + i) * size * 0.02;
    ctx.drawImage(g, off + widths[i] / 2 - g.width / 2, -g.height / 2 + jig);
    off += widths[i];
  });
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function pill(text, x, y, size, u, { bg = "rgba(14,5,24,0.92)", fg = "#b6ff1c", accent = "#ff7a0d" } = {}) {
  if (u <= 0) return;
  const s = easeOutBack(u);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.font = `${size}px ${FONT}`;
  ctx.letterSpacing = `${Math.round(size * 0.06)}px`;
  const w = ctx.measureText(text).width + size * 1.4, h = size * 1.55;
  roundRect(-w / 2, -h / 2, w, h, h / 2);
  ctx.fillStyle = bg;
  ctx.fill();
  if (accent) { ctx.lineWidth = size * 0.14; ctx.strokeStyle = accent; ctx.stroke(); }
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  if (fg !== INK) { ctx.lineWidth = size * 0.16; ctx.strokeStyle = INK; ctx.strokeText(text, 0, size * 0.04); }
  ctx.fillStyle = fg;
  ctx.fillText(text, 0, size * 0.04);
  ctx.restore();
}
function screenOf(v) {
  const p = v.clone().project(camera);
  return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H];
}
const worldOf = (k, name) => k.obj.getObjectByName(name).getWorldPosition(new THREE.Vector3());

// ================================================================== cell grids (moves, skin tones)
function renderCells(cells, scene, aimCam) {
  ctx.fillStyle = "#1a1230";
  ctx.fillRect(0, 0, W, H);
  renderer.setScissorTest(true);
  const all = new Set(cells.flatMap(c => c.kids));
  for (const c of cells) {
    for (const k of all) k.obj.visible = c.kids.includes(k);
    renderer.setViewport(c.x, H - c.y - c.h, c.w, c.h);
    renderer.setScissor(c.x, H - c.y - c.h, c.w, c.h);
    camera.aspect = c.w / c.h;
    aimCam(c);
    aimFill(scene, V3(0, 2.6, 0));
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
  }
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, W, H);
  camera.aspect = W / H;
  for (const c of cells) {
    ctx.save();
    roundRect(c.x, c.y, c.w, c.h, 40);
    ctx.clip();
    ctx.drawImage(gl, c.x, c.y, c.w, c.h, c.x, c.y, c.w, c.h);
    ctx.restore();
    ctx.save();
    roundRect(c.x, c.y, c.w, c.h, 40);
    ctx.lineWidth = 10; ctx.strokeStyle = c.border || "#ff8a2b"; ctx.stroke();
    ctx.restore();
  }
}
function grid(cols, rows, top, bottom, gap = 30, margin = 44) {
  const w = (W - 2 * margin - (cols - 1) * gap) / cols, h = (bottom - top - (rows - 1) * gap) / rows;
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    cells.push({ x: Math.round(margin + c * (w + gap)), y: Math.round(top + r * (h + gap)), w: Math.round(w), h: Math.round(h) });
  return cells;
}

    show(sim, false);

    const L = [0, 1].map(i => Math.hypot(this.path[i + 1][0] - this.path[i][0], this.path[i + 1][1] - this.path[i][1]));

// 3. Roll call (4 bars): a costume every two beats. Each kid hops in on the beat, strikes a
//    pose and holds it for a beat so it reads, then slides off as the next one hops in.
const ROLL = ["inflatable-trex", "vending-machine", "marie-antoinette", "octopus", "taco", "mummy", "rocket", "unicorn"];
const ROLL_POSE = ["attack", "dance-robot", "spin", "dance-wiggle", "celebrate", "attack", "jump", "celebrate"];
const ROLL_BEATS = 2;
let rollKids = [];
shots.push({
  name: "roll", bars: 4, scene: STAGE, flash: true,
  setup() {
    stageSet("roll");
  },
  update(lt) {
    const span = ROLL_BEATS * BEAT;
    rollKids.forEach((k, i) => {
      // t: time since this kid's beat. It hops in over the 0.22 s before the beat and lands on it;
      // it slides off over the 0.2 s before the next kid lands.
      const t = lt - i * span, last = i === rollKids.length - 1, HOP = 0.22;
      if (t < -HOP || (!last && t > span)) { k.obj.visible = false; return; }
      k.obj.visible = true;
      const inU = smooth((t + HOP) / HOP), outU = last ? 0 : smooth((t - span + 0.2) / 0.2);
      const x = lerp(7.5, 0, inU) - outU * 8.5;
      const hop = Math.sin(Math.PI * clamp01((t + HOP) / HOP)) * 2.4;
      const sq = t >= 0 ? Math.max(0, 1 - t / 0.12) : 0;   // a little squash on landing
      place3(k, x, hop, 0, -0.3 + outU * -0.6);
      k.obj.scale.set(1 + 0.06 * sq, 1 - 0.08 * sq, 1 + 0.06 * sq);
      once("pose" + i, () => play(k, ROLL_POSE[i], { force: true, ts: 1.0 }));
      if (t > 0.1) k.face = { mouth: "grin" };
      onBeat(lt, i * ROLL_BEATS, "roll", () => { sfxB("pop", 0.9, i * ROLL_BEATS, { pitch: i }); });
    });
  },
  cam(lt) { return { pos: V3(lerp(-0.6, 0.6, lt / (4 * BAR)), 4.6, 23.5), look: V3(0, 3.7, 0), fov: 30 }; },
  text(lt) {
    balloon("96 COSTUMES", 0.105, 150, lt - 0.05, { ci0: 0 });
    const i = Math.min(ROLL.length - 1, Math.floor(lt / (ROLL_BEATS * BEAT) + 1e-6));
    pill(humanize(ROLL[i]), W / 2, H * 0.86, 66, ((lt - i * ROLL_BEATS * BEAT) - 0.12) / 0.16, { accent: ACCENTS[i % 3] });
  },
});

// ------------------------------------------------------------------ ?check=1: nobody clips
// Steps the whole trailer without drawing and, in every street frame, tests each visible kid's
// footprint (an oriented box, 85% of the bind pose) against every other kid and the solid props.
function footprintTest(a, b) {   // oriented boxes {x, z, hw, hd, yaw}: the overlap depth, or <= 0
  const axes = [];
  for (const o of [a, b]) axes.push([Math.cos(o.yaw), -Math.sin(o.yaw)], [Math.sin(o.yaw), Math.cos(o.yaw)]);
  const dx = b.x - a.x, dz = b.z - a.z;
  let best = Infinity;
  for (const [ax, az] of axes) {
    const proj = o => o.hw * Math.abs(Math.cos(o.yaw) * ax - Math.sin(o.yaw) * az) + o.hd * Math.abs(Math.sin(o.yaw) * ax + Math.cos(o.yaw) * az);
    best = Math.min(best, proj(a) + proj(b) - Math.abs(dx * ax + dz * az));
    if (best <= 0) return best;
  }
  return best;
}
function solidProps() {
  const SOLID = /^(car|lamp|hydrant|street-sign|mailbox|jack|tombstone|crow|hay|bush|hedge|tree)/;
  const out = [];
  for (const [slug, list] of placements) {
    if (!SOLID.test(slug) || !instanced.has(slug)) continue;
    const b = new THREE.Box3();
    for (const im of instanced.get(slug)) { im.geometry.computeBoundingBox(); b.union(im.geometry.boundingBox); }
    const slim = slug.startsWith("lamp") || slug.startsWith("tree") ? 0.5 : 1;   // lamps and trees: only the post / trunk is solid
    for (const t of list) {
      const sx = (t.sx ?? t.s ?? 1) * slim, sz = (t.sz ?? t.s ?? 1) * slim;
      out.push({ slug, x: t.x + (b.min.x + b.max.x) / 2, z: t.z + (b.min.z + b.max.z) / 2, hw: (b.max.x - b.min.x) / 2 * sx, hd: (b.max.z - b.min.z) / 2 * sz, yaw: t.ry || 0 });
    }
  }
  return out;
}
async function clipCheck() {
  const props = solidProps(), worst = {};

  const N = Math.round(TOTAL * FPS);
  step(0, false);
  for (let f = 1; f < N; f++) {
    step(1 / FPS, false);
    const sh = shots[shotIx];
    if (sh.scene !== STREET) continue;
    const c = sh.cam.call(sh, T - STARTS[shotIx]);   // only what the camera sees counts
    camera.position.copy(c.pos); camera.lookAt(c.look); camera.fov = c.fov || 30; camera.aspect = W / H;
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    const fr = new THREE.Frustum().setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
    const ks = KIDS.filter(k => k.obj.parent === STREET && k.obj.visible && fr.containsPoint(k.obj.position.clone().setY(k.obj.position.y + 0.5))).map(k => ({ k, x: k.obj.position.x, z: k.obj.position.z, hw: k.hw * 0.85, hd: k.hd * 0.85, yaw: k.obj.rotation.y }));
    for (let i = 0; i < ks.length; i++) {
      for (let j = i + 1; j < ks.length; j++) note(`${sh.name}: ${ks[i].k.slug} x ${ks[j].k.slug}`, footprintTest(ks[i], ks[j]), T);
      for (const p of props) note(`${sh.name}: ${ks[i].k.slug} x ${p.slug}`, footprintTest(ks[i], p), T);
    }
  }
  const report = Object.entries(worst).sort((a, b) => b[1].depth - a[1].depth);
  console.log("clip check: " + (report.length ? report.map(([k, v]) => `${k} ${v.depth} @${v.t}`).join(" | ") : "no overlaps"));
  await fetch("/still/check", { method: "POST", body: JSON.stringify(report, null, 1) });
}

  if (!custom) {
    renderer.render(s.scene, camera);
    ctx.drawImage(gl, 0, 0, W, H);
  }
  if (s.text) s.text.call(s, lt);
  if (flash > 0.01) {
    ctx.fillStyle = `rgba(${flashCol},${flash * 0.8})`;
    ctx.fillRect(0, 0, W, H);
    flash *= 0.6;
  }
}

// ------------------------------------------------------------------ load and go
async function main() {
  ctx.fillStyle = "#140e22"; ctx.fillRect(0, 0, W, H);
  await document.fonts.load(`100px "Creepster"`);
  const slugs = [...new Set([...SIM_KIDS, ...ROLL, ...TONE_SIX, ...MOVE_KIDS, ...PARADE_KIDS, "witch", "kid-puffs", "kid-curly",
    "princess", "ghost", "pumpkin-clown", "superhero", "cupcake", "inflatable-trex", "kid-spiky", "baker", "sports-player", "angel"])];
  const gltfs = await Promise.all(slugs.map(s => load(`${A}chars/${s}.glb`)));
  slugs.forEach((s, i) => KSRC.set(s, gltfs[i]));
  const conv = new Map();
  for (const g of gltfs) g.scene.traverse(o => {
    if (!o.isMesh) return;
    const f = m => { if (!conv.has(m)) conv.set(m, kidMaterial(m)); return conv.get(m); };
    o.material = Array.isArray(o.material) ? o.material.map(f) : f(o.material);
  });
  await layout();
  buildCandy();
  await buildInstances();
  buildPools();
  for (const m of glowMats) m.emissiveIntensity = m.userData.base * 1.6;   // the dusk mode
  spawnSim();
  await buildHouse();

  // the scripted kids
  hero = houses[2];
  witch = makeKid("witch", { scale: KID_SCALE, parent: STREET, skin: 1 });
  crew = ["pumpkin-clown", "superhero", "cupcake", "inflatable-trex"].map((s, i) => makeKid(s, { scale: KID_SCALE, parent: STREET, skin: [3, 0, 5, 2][i] }));
  booKid = makeKid("princess", { scale: KID_SCALE, parent: STREET, skin: 4 });
  ghostKid = makeKid("ghost", { scale: KID_SCALE, parent: STREET });
  PARADE_KIDS.forEach((s, i) => PARADE.push(makeKid(s, { scale: KID_SCALE, parent: STREET, skin: (i * 5) % 6 })));
  show(PARADE, false);
  show([booKid, ghostKid], false);

  // the stage sets
  const roll = new THREE.Group(), plain = new THREE.Group(), bset = new THREE.Group();
  STAGE_SETS.roll = roll; STAGE_SETS.plain = plain; STAGE_SETS.build = bset;
  const jack = async (slug, x, z, s, ry, parent) => {
    const g = await load(`${A}street-assets/${slug}.glb`);
    const m = g.scene.clone(true);
    m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    m.position.set(x, 0, z); m.scale.setScalar(s); m.rotation.y = ry;
    parent.add(m);
  };
  await jack("jack-large", -4.2, -6, 1.7, 0.5, roll);
  await jack("jack-medium", 4.4, -7, 1.7, -0.5, roll);
  await jack("tombstone-round", -6.4, -16, 2.2, 0.3, roll);
  await jack("tombstone-cross", 6.6, -17, 2.2, -0.2, roll);
  await jack("jack-small", -9, 6, 2.5, 0.2, bset);
  await jack("jack-medium", 10, 5, 2.5, -0.4, bset);
  await jack("tombstone-round", -13, -6, 2.5, 0.3, bset);
  await jack("tree-gnarled", 16, -10, 1.8, 1.2, bset);
  bset.add(build.group);
  STAGE.add(roll, plain, bset);
  stageSet("roll");
  rollKids = ROLL.map((s, i) => makeKid(s, { parent: STAGE, skin: (i * 2 + 1) % 6 }));
  show(rollKids, false);
  toneKid = makeKid("baker", { parent: STAGE, skin: 0 });
  toneSix = TONE_SIX.map(s => makeKid(s, { parent: STAGE }));
  faceKid = makeKid("sports-player", { parent: STAGE, skin: 2 });
  moveKids = MOVE_KIDS.map((s, i) => makeKid(s, { parent: STAGE, skin: [1, 3, 0, 4][i] }));
  buildKid = makeKid("kid-spiky", { scale: KID_SCALE, parent: STAGE, skin: 3 });
  STAGE_KIDS.push(...rollKids, toneKid, ...toneSix, faceKid, ...moveKids, buildKid);
  stageSet("roll");
  for (const k of [witch, ...crew]) k.obj.visible = false;

  if (RECORD) {
    const N = Math.round(TOTAL * FPS);
    for (let f = 0; f < N; f++) {
      step(f === 0 ? 0 : 1 / FPS);
      const blob = await new Promise(r => out.toBlob(r, "image/jpeg", 0.93));
      await fetch(`/frame/${f}`, { method: "POST", body: blob });
    }
    await fetch("/events", { method: "POST", body: JSON.stringify({ fps: FPS, bpm: BPM, total: TOTAL, cues: CUES, events }) });
    document.title = "DONE";
    return;
  }
  const save = async name => {
    if (!Q.has("save")) return;
    await fetch(`/still/${name}`, { method: "POST", body: await new Promise(r => out.toBlob(r, "image/jpeg", 0.9)) });
  };
  if (Q.has("check")) { await clipCheck(); document.title = "CHECKED"; return; }
  if (Q.has("events")) {   // the sound cues only, without drawing (for checking the beat grid)
    const N = Math.round(TOTAL * FPS);
    step(0, false);
    for (let f = 1; f < N; f++) step(1 / FPS, false);
    await fetch("/still/events", { method: "POST", body: JSON.stringify({ fps: FPS, bpm: BPM, total: TOTAL, cues: CUES, events }) });
    return;
  }
  if (Q.has("sheet")) {
    const ts = Q.get("sheet").split(",").map(Number).sort((a, b) => a - b);
    const cols = 6, cw = W / 4, ch = H / 4;
    const sheet = document.createElement("canvas");
    sheet.width = cw * Math.min(cols, ts.length); sheet.height = ch * Math.ceil(ts.length / cols);
    const sc = sheet.getContext("2d");
    step(0, false);
    for (let i = 0; i < ts.length; i++) {
      while (T + 1 / FPS <= ts[i] + 1e-6) step(1 / FPS, T + 2 / FPS > ts[i]);
      sc.drawImage(out, (i % cols) * cw, Math.floor(i / cols) * ch, cw, ch);
      sc.fillStyle = "#fff"; sc.font = "bold 22px sans-serif"; sc.fillText(ts[i].toFixed(2) + "s", (i % cols) * cw + 8, Math.floor(i / cols) * ch + 26);
    }
    out.width = sheet.width; out.height = sheet.height;
    ctx.drawImage(sheet, 0, 0);
    await save("sheet");
    document.title = "SHEET";
    return;
  }
  if (Q.has("at")) {
    const target = +Q.get("at");
    step(0, false);
    while (T + 1 / FPS <= target + 1e-6) step(1 / FPS, T + 2 / FPS > target);
    await save("at");
    document.title = "AT " + T.toFixed(2);
    return;
  }
  let last = performance.now();
  step(0);
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (T + dt >= TOTAL) location.reload();
    else step(dt);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
main();
</script>
