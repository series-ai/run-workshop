<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bobble swarm test</title>
<style>
  html, body { margin: 0; height: 100%; background: #ece5d8; font: 14px/1.3 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 10px; left: 10px; background: rgba(255,248,238,0.92); border-radius: 10px; padding: 10px 14px; min-width: 260px; }
  #hud b { font-size: 22px; }
  #hud .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  button { font: inherit; border: 1px solid #cdbfa8; background: #fff8ee; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  button.on { background: #e8743b; color: #fff; border-color: #e8743b; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three-build/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b id="fps">–</b> fps &nbsp; <span id="ms"></span></div>
  <div id="stats"></div>
  <div class="row">Kids <span id="n"></span>
    <button data-n="10">10</button><button data-n="30">30</button><button data-n="50">50</button><button data-n="100">100</button></div>
  <div class="row">Mix <button id="mix" class="on">all costumes</button></div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as skinnedClone } from "three/addons/utils/SkeletonUtils.js";

// A stress test: N kids at once, each its own copy with its own animation mixer, milling about.
// The HUD shows the frame rate and what the GPU is asked to do per frame.
const MOVES = ["idle", "walk", "run", "celebrate", "dance-wiggle", "trick-or-treat", "wave", "jump", "sneak", "spin"];
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xece5d8);
renderer.info.autoReset = false;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff6ea, 0xb9a98f, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(4, 10, 7);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0xd9ccb6, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const cam = new THREE.PerspectiveCamera(35, 1, 0.5, 400);
cam.position.set(0, 46, 62);
cam.lookAt(0, 2, 0);

const loader = new GLTFLoader();
const bust = `?t=${Date.now()}`;
const slugs = await (await fetch(`chars/index.json${bust}`)).json();
const cache = new Map();
async function source(slug) {
  if (!cache.has(slug)) cache.set(slug, loader.loadAsync(`chars/${slug}.glb${bust}`));
  return cache.get(slug);
}

let kids = [];
let mixAll = true;
async function spawn(n) {
  for (const k of kids) scene.remove(k.obj);
  kids = [];
  const pick = mixAll ? slugs : slugs.slice(0, 1);
  const grid = Math.ceil(Math.sqrt(n));
  for (let i = 0; i < n; i++) {
    const g = await source(pick[i % pick.length]);
    const obj = skinnedClone(g.scene);  // skinned kids need their own skeleton per copy
    const s = 0.55;
    obj.scale.setScalar(s);
    const x = (i % grid - (grid - 1) / 2) * 6.5 + (Math.random() - 0.5) * 2;
    const z = (Math.floor(i / grid) - (grid - 1) / 2) * 6.5 + (Math.random() - 0.5) * 2;
    obj.position.set(x, 0, z);
    obj.rotation.y = Math.random() * Math.PI * 2;
    scene.add(obj);
    const mixer = new THREE.AnimationMixer(obj);
    const clip = g.animations.find((a) => a.name === MOVES[i % MOVES.length]) || g.animations[0];
    const a = mixer.clipAction(clip);
    a.play();
    a.time = Math.random() * clip.duration;
    kids.push({ obj, mixer });
  }
  document.getElementById("n").textContent = n;
  document.querySelectorAll("[data-n]").forEach((b) => b.classList.toggle("on", +b.dataset.n === n));
}
document.querySelectorAll("[data-n]").forEach((b) => (b.onclick = () => spawn(+b.dataset.n)));
document.getElementById("mix").onclick = (e) => {
  mixAll = !mixAll;
  e.target.textContent = mixAll ? "all costumes" : "one costume";
  e.target.classList.toggle("on", mixAll);
  spawn(kids.length || 30);
};

const clock = new THREE.Clock();
let frames = 0, acc = 0;
function frame() {
  const dt = clock.getDelta();
  for (const k of kids) k.mixer.update(dt);
  const W = innerWidth, H = innerHeight;
  if (canvas.width !== Math.floor(W * renderer.getPixelRatio())) { renderer.setSize(W, H, false); cam.aspect = W / H; cam.updateProjectionMatrix(); }
  renderer.info.reset();
  renderer.render(scene, cam);
  frames++; acc += dt;
  if (acc > 0.5) {
    document.getElementById("fps").textContent = Math.round(frames / acc);
    document.getElementById("ms").textContent = `${(1000 * acc / frames).toFixed(1)} ms/frame`;
    const r = renderer.info.render;
    document.getElementById("stats").textContent = `${r.calls} draw calls · ${(r.triangles / 1000).toFixed(0)}k triangles`;
    frames = 0; acc = 0;
  }
  requestAnimationFrame(frame);
}
await spawn(30);
frame();
</script>
</body>
</html>
