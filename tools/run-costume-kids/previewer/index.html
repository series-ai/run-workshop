<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bobble costume previewer</title>
<style>
  :root { --bg: #ece5d8; --ink: #2a2522; --chip: #fff8ee; --accent: #e8743b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.3 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 14px; background: rgba(236,229,216,0.94); border-bottom: 1px solid #d6cbb8; }
  #bar .group { display: flex; gap: 4px; align-items: center; }
  #bar label { font-weight: 600; margin-right: 4px; }
  button { font: inherit; border: 1px solid #cdbfa8; background: var(--chip); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: white; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; }
  .swatch.on { outline: 3px solid var(--accent); outline-offset: 1px; color: transparent; }
  input[type=search] { font: inherit; padding: 5px 10px; border-radius: 999px; border: 1px solid #cdbfa8; width: 160px; }
  #count { opacity: 0.6; }
  #grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 150px), 1fr)); gap: 6px; padding: 10px; }
  .cell { position: relative; aspect-ratio: 0.8; border-radius: 10px; cursor: pointer; }
  .cell:hover { outline: 2px solid #e8743b55; }
  .cell span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 12px; font-weight: 600; pointer-events: none; }
  .cell.loading::after { content: "…"; position: absolute; inset: 0; display: grid; place-items: center; opacity: 0.4; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  #msg { padding: 20px; font-size: 16px; }
  #focus { position: fixed; inset: 0; z-index: 10; display: none; background: var(--bg); }
  #focus.open { display: block; }
  #focus canvas { width: 100%; height: 100%; display: block; }
  #focus .top { position: absolute; top: 10px; left: 14px; right: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #focus h2 { margin: 0 10px 0 0; font-size: 20px; }
  #focus .hint { position: absolute; bottom: 10px; left: 14px; opacity: 0.55; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three-build/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<div id="bar">
  <div class="group" id="clips"><label>Clip</label></div>
  <div class="group"><label>Speed</label><input id="speed" type="range" min="0.1" max="2" step="0.05" value="1"><span id="speedv">1.0×</span></div>
  <div class="group" id="skins"><label>Skin</label></div>
  <div class="group"><button id="pause">Pause</button><button id="sync" class="on">In sync</button><button id="turn">Turntable</button><button id="buckets" class="on">Buckets</button></div>
  <div class="group"><label>Size</label><input id="size" type="range" min="90" max="320" step="10" value="150"></div>
  <div class="group"><input id="filter" type="search" placeholder="Filter…"><span id="count"></span></div>
</div>
<div id="msg"></div>
<div id="grid"></div>
<canvas id="c"></canvas>
<div id="focus">
  <canvas id="fc"></canvas>
  <div class="top"><h2 id="fname"></h2><div class="group" id="fclips"></div><button id="prev">◀</button><button id="next">▶</button><button id="close">Close (Esc)</button></div>
  <div class="hint">Drag to orbit · scroll to zoom · ←/→ previous/next character · 1–9 or ↑/↓ clips · space pause</div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
