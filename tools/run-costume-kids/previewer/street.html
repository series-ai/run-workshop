<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bobble trick-or-treat street</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2a55; font: 14px/1.3 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 10px; left: 10px; background: rgba(255,248,238,0.9); color: #2a2522; border-radius: 10px; padding: 10px 14px; min-width: 240px; }
  #hud b { font-size: 22px; }
  #hud .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  #hud .dim { opacity: 0.6; font-size: 12px; }
  button { font: inherit; border: 1px solid #cdbfa8; background: #fff8ee; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  button.on { background: #e8743b; color: #fff; border-color: #e8743b; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: #fff8ee; font-size: 18px; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three-build/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b id="fps">–</b> fps &nbsp; <span id="ms"></span></div>
  <div id="stats"></div>
  <div class="row"><button id="dusk" class="on">Dusk</button><button id="day">Day</button><button id="shadows" class="on">Shadows</button><button id="pause">Pause</button></div>
  <div class="dim">Drag to orbit · scroll to zoom · right-drag to pan</div>
</div>
<div id="msg">Loading the street…</div>
<script type="module" src="./street.js"></script>
</body>
</html>
