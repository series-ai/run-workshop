<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chonky Hounds: Doggo Dynasties — trailer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1f24; display: grid; place-items: center; overflow: hidden; }
  canvas#out { height: 100vh; aspect-ratio: 9 / 16; display: block; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Cinzel:wght@700;900&display=block" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
// The trailer, choreographed shot by shot with the real rigged dogs, shared clips, coats,
// wearables and props. Live: plays in real time and loops. ?record=1: steps exactly 1/30 s
// per frame and posts every frame (and the sound cues) to promo/server.py. ?at=12.5 jumps
// to a moment; ?sheet=1,5,9 makes a contact sheet of moments.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import { loadClipLibrary, setupDog, attachWear } from "../dogclips.js";
import { loadCoats, breed, loadClothPatterns, tintCloth } from "../dogcoat.js";

const Q = new URLSearchParams(location.search);
const W = 1080, H = 1920, FPS = 30;
const RECORD = Q.has("record");
const FONT = `"Titan One", "Arial Rounded MT Bold", Arial, sans-serif`;
const EPIC = `"Cinzel", "Trajan Pro", Georgia, serif`;   // the movie-trailer cards
const BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT;   // every cut and pop lands on the beat
const ADULT = { toy: 0.45, small: 0.65, medium: 0.85, large: 1.1 }, PUPPY = 0.45;

// ------------------------------------------------------------------ renderer and scene
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const out = document.getElementById("out");
const ctx = out.getContext("2d");

const scene = new THREE.Scene();
scene.background = new THREE.Color("#bfe6f5");
scene.fog = new THREE.Fog("#bfe6f5", 22, 48);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 200);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8fc06a, 1.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2);
sun.position.set(5, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// the backyard: a lawn with mown stripes, a picket fence round the edge
function lawnTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const x = c.getContext("2d");
  for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? "#9fd47c" : "#93cb70"; x.fillRect(0, i * 64, 512, 64); }
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = `rgba(${60 + Math.random() * 40},${120 + Math.random() * 50},${40 + Math.random() * 30},0.35)`;
    x.fillRect(Math.random() * 512, Math.random() * 512, 2, 5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(10, 10);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const lawn = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshLambertMaterial({ map: lawnTexture() }));
lawn.rotation.x = -Math.PI / 2;
lawn.receiveShadow = true;
scene.add(lawn);
const fence = new THREE.Group();
{
  const white = new THREE.MeshLambertMaterial({ color: 0xfbf7ef });
  const post = new THREE.BoxGeometry(0.14, 0.9, 0.06), rail = new THREE.BoxGeometry(0.4, 0.07, 0.04);
  const R = 13;
  for (let i = 0; i < 300; i++) {
    const a = i / 300 * Math.PI * 2;
    const p = new THREE.Mesh(post, white);
    p.position.set(Math.cos(a) * R, 0.45, Math.sin(a) * R);
    p.rotation.y = -a + Math.PI / 2;
    fence.add(p);
    for (const y of [0.3, 0.65]) {
      const r = new THREE.Mesh(rail, white);
      r.position.set(Math.cos(a) * (R + 0.05), y, Math.sin(a) * (R + 0.05));
      r.rotation.y = -a + Math.PI / 2;
      fence.add(r);
    }
  }
}
scene.add(fence);

let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ------------------------------------------------------------------ assets
const loader = new GLTFLoader();
const lib = await loadClipLibrary(loader, "../rigged/clips.glb");
const coats = await loadCoats("../coats.json", "../rigged/coats/");
const BREEDS = (await (await fetch("../breeds.csv")).text()).trim().split("\n").slice(1)
  .map(l => l.split(",")).map(([slug, name, size]) => ({ slug, name, size }));
const SIZE = Object.fromEntries(BREEDS.map(b => [b.slug, b.size]));
const NAME = Object.fromEntries(BREEDS.map(b => [b.slug, b.name]));
const G = {}, WEAR = {}, PROP = {};
await Promise.all(BREEDS.map(async b => { G[b.slug] = await loader.loadAsync(`../rigged/${b.slug}.glb`); }));
await coats.preload(BREEDS.map(b => b.slug));
const WEAR_DOGS = ["labrador-retriever", "pug", "pembroke-welsh-corgi", "dalmatian", "beagle", "shiba-inu", "boxer", "border-collie"];
await Promise.all(WEAR_DOGS.flatMap(s => ["collar", "bandana"].map(async k => {
  WEAR[`${s}--${k}`] = await loader.loadAsync(`../rigged/wear/${s}--${k}.glb`);
})));
const PROPS = ["tennis-ball", "towel", "cardboard-box", "donut-bed", "teepee", "sofa-bed", "rope-toy", "plush-fox", "squeaky-bone",
  "floor-bowl--food", "water-fountain", "dog-house", "fire-hydrant", "frisbee"];
await Promise.all(PROPS.map(async p => { PROP[p] = await loader.loadAsync(`../props/models/${p}.glb`); }));
const cloth = await loadClothPatterns("../rigged/wear/cloth.png");
const palette = (b, slug) => {
  if (!slug) { const i = coats.index[b]; return { ...i.original, layers: i.layers.map(() => ["#000000", 0]) }; }
  return coats.palette(b, slug);
};

// ------------------------------------------------------------------ actors
let actors = [], things = [], tweens = [], T = 0, events = [];
const sfx = (type, gain = 1) => events.push({ t: +T.toFixed(4), type, gain });

class Dog {
  constructor(slug, { x = 0, z = 0, ry = 0, scale = ADULT[SIZE[slug]], coat = null } = {}) {
    this.slug = slug;
    this.group = new THREE.Group();
    this.group.position.set(x, 0, z);
    this.group.rotation.y = ry;
    this.model = SkeletonUtils.clone(G[slug].scene);
    this.model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
    this.group.add(this.model);
    this.setScale(scale);
    scene.add(this.group);
    this.dog = setupDog(this.model, lib);
    this.coat = coats.applyNow(this.model, slug);
    if (coat) this.coat.set(typeof coat === "string" ? palette(slug, coat) : coat);
    this.dog.onEvent = ev => {
      if (ev.startsWith("bark")) sfx(this.scale < 0.6 ? "yip" : this.scale > 0.95 ? "bigwoof" : "woof", 0.9);
    };
    this.queue = [];
    actors.push(this);
  }
  setScale(s) { this.scale = s; this.group.scale.setScalar(s); }
  play(name, { at = 0, ts = 1, fade = 0.15, then = null } = {}) {
    const a = this.dog.play(name, { fade, time: at });
    a.timeScale = ts;
    this.then = then;
    return this;
  }
  // a list of clips, each starting when the one before finishes (the last one loops if it's a loop)
  chain(...names) { this.queue = names.slice(1); this.play(names[0]); return this; }
  gait(name, speed) {  // speed in world units / s; feet stay matched to the ground
    if (this.dog.name !== name) this.play(name, { fade: 0.2 });
    this.dog.setSpeed(speed, this.scale);
  }
  natural(name) { const m = lib.meta[name]; return m.stride * this.dog.leg * this.scale / m.duration; }
  update(dt) {
    this.dog.update(dt);
    const a = this.dog.action, m = lib.meta[this.dog.name];
    if (a && m && !m.loop && a.time >= m.duration - 1e-3) {
      if (this.queue.length) this.play(this.queue.shift());
      else if (this.then) { const f = this.then; this.then = null; f(); }
    }
  }
  wear(kind, on, color = "#b8322a", pattern = "dots") {
    this.worn ||= {};
    if (!this.worn[kind]) {
      const src = WEAR[`${this.slug}--${kind}`];
      const sc = SkeletonUtils.clone(src.scene);
      const meshes = attachWear(this.model, sc);
      meshes.forEach(mm => { mm.material = Array.isArray(mm.material) ? mm.material.map(x => x.clone()) : mm.material.clone(); mm.castShadow = true; });
      this.worn[kind] = meshes;
    }
    for (const mm of this.worn[kind]) {
      mm.visible = on;
      for (const mat of [mm.material].flat()) {
        if (mat.name === "bandana") tintCloth(mat, cloth, color, "#f6f0e4", pattern);
        if (mat.name === "collar") mat.color.set(color);
      }
    }
  }
  pos(bone = "head") {
    const b = this.dog.root.getObjectByName(bone);
    return b ? b.getWorldPosition(new THREE.Vector3()) : this.group.position.clone();
  }
}

function place(name, x, z, ry = 0, s = 1) {
  const m = SkeletonUtils.clone(PROP[name].scene);
  m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  m.position.set(x, 0, z);
  m.rotation.y = ry;
  m.scale.setScalar(s);
  scene.add(m);
  things.push(m);
  return m;
}

function tween(t0, dur, fn, ease = e => e) { tweens.push({ t0, dur, fn, ease }); }
const easeInOut = u => u * u * (3 - 2 * u);
const easeOut = u => 1 - (1 - u) ** 3;
const easeOutBack = u => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const lerp = (a, b, u) => a + (b - a) * u;
const clamp01 = u => Math.max(0, Math.min(1, u));

// ------------------------------------------------------------------ camera
let shake = 0, kick = 0, flash = 0;
const rumble = a => { shake = Math.max(shake, a); };
const punch = a => { kick = Math.max(kick, a); };
function cam(px, py, pz, tx, ty, tz) { camera.position.set(px, py, pz); camera.lookAt(tx, ty, tz); }

// ------------------------------------------------------------------ camera rule
// These dogs look best from three-quarters above, a few at a time or a crowd: never closer
// than a medium shot. orbit(target, distance, pitch down (deg), yaw (deg)).
function orbit(tx, ty, tz, dist, pitch, yaw) {
  const p = THREE.MathUtils.degToRad(pitch), y = THREE.MathUtils.degToRad(yaw);
  cam(tx + Math.sin(y) * Math.cos(p) * dist, ty + Math.sin(p) * dist, tz + Math.cos(y) * Math.cos(p) * dist, tx, ty, tz);
}
// dusk for the "in a world" open, day for everything after
function light(mode) { lightMix(mode === "dusk" ? 0 : 1); }
function lightMix(u) {   // 0 dusk .. 1 day
  const mix = (a, b) => new THREE.Color(a).lerp(new THREE.Color(b), u);
  hemi.intensity = lerp(0.55, 1.8, u);
  hemi.color.copy(mix(0x8c84c8, 0xffffff));
  sun.intensity = lerp(0.9, 2.2, u);
  sun.color.copy(mix(0xffa86b, 0xfff2dc));
  scene.background.copy(mix("#3b3566", "#bfe6f5"));
  scene.fog.color.copy(scene.background);
}
// the opening is one continuous move over the same crowd: dusk, the cards, the scratch into day
function introCam(t) {
  const u = easeInOut(clamp01((t - BAR) / (4 * BAR)));
  orbit(0, 0.3, -0.7, lerp(11, 9.0, u), lerp(36, 44, u), lerp(-14, 16, u));
}

// ------------------------------------------------------------------ the dognado
// nose to tail and fast, a different gait in every ring: toys do the robot in the middle,
// small dogs trot, mediums run, big dogs gallop round the outside
function dognado() {
  const by = s => { const l = BREEDS.filter(b => b.size === s); return [...l, ...l]; };   // every breed twice: nose to tail
  const rings = [
    { gait: "robot", r: 0.9, dogs: by("toy"), pace: 1.35 },
    { gait: "trot", r: 2.3, dogs: by("small"), pace: 1.4 },
    { gait: "run", r: 3.35, dogs: by("medium"), pace: 1.3 },
    { gait: "gallop", r: 4.6, dogs: by("large"), pace: 1.25 },
  ];
  for (const ring of rings) {
    ring.actors = ring.dogs.map((b, k) => { const d = new Dog(b.slug); d.slot = k / ring.dogs.length; return d; });
    const nat = ring.actors.reduce((s, d) => s + d.natural(ring.gait), 0) / ring.actors.length;
    ring.speed = nat * ring.pace;
    ring.lap = rnd() * Math.PI * 2;
    ring.dir = rings.indexOf(ring) % 2 ? -1 : 1;   // alternate rings run the other way round
    ring.actors.forEach(d => { d.play(ring.gait, { at: rnd() * lib.meta[ring.gait].duration }); d.dog.setSpeed(ring.speed, d.scale); });
  }
  return rings;
}
function spinRings(rings, dt) {
  for (const ring of rings) {
    ring.lap += ring.dir * dt * ring.speed / ring.r;
    for (const d of ring.actors) {
      const a = d.slot * Math.PI * 2 + ring.lap;
      d.group.position.set(Math.cos(a) * ring.r, 0, Math.sin(a) * ring.r);
      d.group.rotation.y = -a + (ring.dir < 0 ? Math.PI : 0);
    }
  }
}

// a loose crowd of dogs, scattered on a jittered grid
function crowd(slugs, cols, gap, { z0 = 0, ry = 0, jitter = 0.25 } = {}) {
  return slugs.map((s, k) => {
    const c = k % cols, r = Math.floor(k / cols);
    const d = new Dog(s, { x: (c - (cols - 1) / 2) * gap + (rnd() - 0.5) * jitter + (r % 2) * gap * 0.3,
      z: z0 - r * gap * 0.9 + (rnd() - 0.5) * jitter, ry: ry + (rnd() - 0.5) * 0.6 });
    return d;
  });
}
const ALL = BREEDS.map(b => b.slug);
const shuffled = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

// ------------------------------------------------------------------ shots
// each: { bars, music (one section name per bar, see music.py), keep, flash, setup(), update(lt, dt), text(lt) }
const shots = [];
const fired = {};
const at = (lt, t, key, fn) => { if (lt >= t && !fired[key]) { fired[key] = true; fn(); } };

// 1-4. the opening: one crowd, one continuous camera move, dusk to day
shots.push({
  bars: 2, music: ["drone", "braam"],
  setup() {
    light("dusk");
    this.pack = crowd(shuffled(ALL), 6, 1.25, { z0: 2.4 });
    this.pack.forEach(d => d.play("idle", { at: rnd() * 2 }));
  },
  update(lt) { introCam(T); at(lt, BAR, "braam", () => rumble(0.06)); },
  text(lt) {
    if (lt < BAR) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); epic("IN A WORLD...", 0.48, 92, lt / 0.6); }
    else epic("...OF CHONK.", 0.16, 110, (lt - BAR) / 0.4);
  },
});
shots.push({
  bars: 1, music: ["braam"], keep: true,
  setup() { rumble(0.06); },
  update() { introCam(T); },
  text(lt) { epic("THIRTY GOOD BOYS.", 0.16, 96, lt / 0.4); },
});
shots.push({   // ONE RIG: all thirty spin together on the hit
  bars: 1, music: ["braam"], keep: true,
  setup() { rumble(0.06); actors.forEach((d, k) => tweens.push({ t0: T + 0.015 * (k % 6), dur: 0, fn: () => d.chain("spin", "idle") })); },
  update() { introCam(T); },
  text(lt) { epic("ONE RIG.", 0.16, 130, lt / 0.4); },
});
shots.push({   // record scratch: the light comes up, everyone play-bows, the title pops
  bars: 1, music: ["title"], keep: true,
  setup() {
    for (let i = 0; i < "CHONKYHOUNDS".length; i++) tweens.push({ t0: T + BEAT * 2 + i * 0.04, dur: 0, fn: () => sfx("pop", 0.3) });
  },
  update(lt) {
    lightMix(easeInOut(clamp01((lt - BEAT * 1.5) / (BEAT * 0.6))));
    at(lt, BEAT * 2, "bow", () => { actors.forEach(d => d.play("play_bow", { at: rnd() * 0.2 })); punch(1); flash = 0.8; });
    introCam(T);
  },
  text(lt) {
    if (lt > BEAT * 2) {
      balloon("CHONKY|HOUNDS", 0.15, 170, lt - BEAT * 2, { stagger: 0.04 });
      balloon("DOGGO DYNASTIES", 0.31, 78, lt - BEAT * 3, { stagger: 0.02 });
    }
  },
});
// 5. the dognado: nose to tail, rings alternating, captions every two beats
const NADO_CAPS = ["THEY TROT.", "THEY RUN.", "THEY GALLOP.", "THEY... ROBOT?"];
shots.push({
  bars: 2, music: ["theme", "theme"], flash: true,
  setup() { this.rings = dognado(); place("fire-hydrant", 0, 0, 0, 1.2); },
  update(lt, dt) {
    spinRings(this.rings, dt);
    NADO_CAPS.forEach((c, k) => at(lt, BEAT * k, "cap" + k, () => { sfx("pop", 0.6); punch(0.3); }));   // bam bam bam bam
    const u = lt / (2 * BAR);
    orbit(0, 0, 0, lerp(10.0, 8.6, easeInOut(u)), lerp(56, 44, easeInOut(u)), lerp(-25, 25, u));
  },
  text(lt) {
    const k = Math.min(3, Math.floor(lt / BEAT));
    balloon(NADO_CAPS[k], 0.13, k === 3 ? 108 : 130, lt - BEAT * k, { stagger: 0.012 });
    if (lt > BAR) pill("(it's very soothing.)", 0.21, 52, (lt - BAR) / 0.25);
  },
});
// 5b. the hydrant gag: a queue, one lifts a leg
shots.push({
  bars: 2, music: ["sneak", "theme"], flash: true,
  setup() {
    this.hyd = place("fire-hydrant", 0.3, 0.16, 0, 1.0);   // by the lifted hind leg
    // the dog stands with its left side to the hydrant (it lifts its left leg)
    this.boy = new Dog("jack-russell-terrier", { x: 0.05, z: -0.3, ry: -Math.PI / 2 });   // facing -x: its left side to the hydrant (+z)
    this.boy.play("pee_male", { at: 1.0 });
    this.queue = ["beagle", "pug", "dachshund", "great-dane"].map((s, k) => {
      const d = new Dog(s, { x: 1.0 + k * 0.95 + (k === 3 ? 0.2 : 0), z: -0.35 + 0.05 * (k % 2), ry: -Math.PI / 2 + 0.15 * (k % 2 ? 1 : -1) });
      d.play(k === 3 ? "sniff" : "idle", { at: rnd() * 2 });
      return d;
    });
    this.stream = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 1, 6), new THREE.MeshLambertMaterial({ color: 0xf2d64b, transparent: true, opacity: 0.8 }));
    this.puddle = new THREE.Mesh(new THREE.CircleGeometry(1, 20), this.stream.material);
    this.puddle.rotation.x = -Math.PI / 2;
    scene.add(this.stream, this.puddle);
    things.push(this.stream, this.puddle);
  },
  update(lt) {
    const m = lib.meta.pee_male, ev = m.events, time = this.boy.dog.action.time;
    const on = time > ev.pee_start && time < ev.pee_end;
    const grown = clamp01((time - ev.pee_start) / (ev.pee_end - ev.pee_start));
    const src = this.boy.pos("shinL").lerp(this.boy.pos("hips"), 0.5);
    const spot = new THREE.Vector3(src.x, 0.004, 0.05);
    this.puddle.visible = grown > 0;
    this.puddle.position.copy(spot);
    this.puddle.scale.setScalar(0.02 + 0.13 * Math.sqrt(grown));
    this.stream.visible = on;
    if (on) {
      const hit = new THREE.Vector3(0.3, 0.18, 0.08);
      this.stream.position.lerpVectors(src, hit, 0.5);
      this.stream.scale.y = src.distanceTo(hit);
      this.stream.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), src.clone().sub(hit).normalize());
    }
    at(lt, BAR, "next", () => { this.queue[0].play("sniff"); sfx("squeak", 0.5); });
    orbit(0.9, 0.2, -0.3, 5.0, 36, lerp(-66, -54, lt / (2 * BAR)));
  },
  text(lt) {
    balloon("THEY STAY|HYDRATED.", 0.12, 118, lt - 0.2, { stagger: 0.03 });
    if (lt > BAR) pill("(there's a queue.)", 0.23, 54, (lt - BAR) / 0.25);
  },
});
// 6. tricks: the two that read from above (up on the hind legs and twirl, the leaping spin),
// in waves across the crowd; one dog just barks at you
shots.push({
  bars: 2, music: ["theme", "theme"], flash: true,
  setup() {
    this.pack = crowd(shuffled(ALL).slice(0, 15), 4, 1.15, { z0: 0.9 });
    this.pack.forEach(d => d.play("idle", { at: rnd() * 2 }));
    this.lazy = this.pack[6];
    this.lazy.dog.onEvent = null;
  },
  update(lt) {
    this.pack.forEach((d, k) => {
      if (d === this.lazy) return;
      const col = Math.round((d.group.position.x + 1.8) / 1.15);   // a wave left to right
      if (k % 2 === 0) at(lt, col * BEAT * 0.25, "d" + k, () => d.chain("dance_enter", "dance_loop"));
      else {
        at(lt, col * BEAT * 0.25, "s" + k, () => d.chain("spin", "idle"));
        at(lt, BAR + col * BEAT * 0.25, "s2" + k, () => d.chain("spin", "idle"));
      }
    });
    at(lt, BEAT * 1.5, "lazy", () => {
      this.lazy.play("bark_rapid");
      this.lazy.dog.onEvent = ev => { if (ev.startsWith("bark")) sfx("woof", 0.5); };
    });
    at(lt, BAR + BEAT * 2, "whoosh", () => sfx("whoosh", 0.6));
    orbit(0, 0.3, -1.0, 9.0, 47, lerp(-10, 10, lt / (2 * BAR)));
  },
  text(lt) {
    balloon("THEY DO TRICKS.", 0.13, 116, lt, { stagger: 0.03 });
    if (lt > BAR) pill("(most of them.)", 0.21, 54, (lt - BAR) / 0.25);

  ctx.bezierCurveTo(40, -55, 60, -10, 0, 30);
  ctx.closePath();
  ctx.lineWidth = 7; ctx.strokeStyle = "#3b2418"; ctx.stroke();
  ctx.fillStyle = "#ff7aa2"; ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath(); ctx.ellipse(-20, -22, 9, 5, -0.6, 0, 7); ctx.fill();
  ctx.restore();
}

// ------------------------------------------------------------------ the frame step
let shotIx = -1;
function clearSet() {
  for (const a of actors) scene.remove(a.group);
  for (const t of things) scene.remove(t);
  actors = []; things = []; tweens = [];
  for (const k in fired) delete fired[k];
}
function step(dt) {
  T += dt;
  let ix = 0;
  while (ix + 1 < shots.length && T >= STARTS[ix + 1] - 1e-6) ix++;
  if (ix !== shotIx) {
    if (!shots[ix].keep) clearSet();
    else for (const k in fired) delete fired[k];
    shotIx = ix;
    if (shots[ix].flash) flash = 1;
    shots[ix].setup.call(shots[ix]);
  }
  const s = shots[ix], lt = Math.max(0, T - STARTS[ix]);   // never a hair below 0 on a cut
  s.update.call(s, lt, dt);
  for (const tw of [...tweens]) {
    if (T < tw.t0) continue;
    const u = tw.dur ? Math.min(1, (T - tw.t0) / tw.dur) : 1;
    tw.fn(tw.ease ? tw.ease(u) : u);
    if (u >= 1) tweens.splice(tweens.indexOf(tw), 1);
  }
  for (const a of actors) a.update(dt);
  if (shake > 0.001) {
    camera.position.x += (rnd() - 0.5) * shake;
    camera.position.y += (rnd() - 0.5) * shake;
    shake *= 0.82;
  }
  camera.fov = 50 - kick * 6;
  camera.updateProjectionMatrix();
  kick *= 0.86;
  renderer.render(scene, camera);
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  if (s.text) s.text.call(s, lt);
  if (flash > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.85})`;
    ctx.fillRect(0, 0, W, H);
    flash *= 0.6;
  }
}

async function main() {
  ctx.fillStyle = "#1d1f24"; ctx.fillRect(0, 0, W, H);
  await document.fonts.load(`100px "Titan One"`);
  await document.fonts.load(`700 100px "Cinzel"`);
  if (RECORD) {
    const N = Math.round(TOTAL * FPS);
    for (let f = 0; f < N; f++) {
      step(1 / FPS);
      const blob = await new Promise(r => out.toBlob(r, "image/jpeg", 0.93));
      await fetch(`/frame/${f}`, { method: "POST", body: blob });
    }
    await fetch("/events", { method: "POST", body: JSON.stringify({ fps: FPS, total: TOTAL, sections: SECTIONS, events }) });
    document.title = "DONE";
    return;
  }
  if (Q.has("sheet")) {
    const ts = Q.get("sheet").split(",").map(Number);
    const cols = 6, cw = W / cols, ch = H / cols;
    const sheet = document.createElement("canvas");
    sheet.width = W; sheet.height = ch * Math.ceil(ts.length / cols);
    const sc = sheet.getContext("2d");
    for (let i = 0; i < ts.length; i++) {
      while (T + 1 / FPS <= ts[i]) step(1 / FPS);
      sc.drawImage(out, (i % cols) * cw, Math.floor(i / cols) * ch, cw, ch);
      sc.fillStyle = "#000"; sc.font = "20px sans-serif"; sc.fillText(ts[i].toFixed(1) + "s", (i % cols) * cw + 6, Math.floor(i / cols) * ch + 22);
    }
    out.width = sheet.width; out.height = sheet.height;
    out.style.height = "auto"; out.style.width = "100vw"; out.style.aspectRatio = "auto";
    ctx.drawImage(sheet, 0, 0);
    window.sheetReady = true;
    if (Q.has("save")) await fetch("/frame/99999", { method: "POST", body: await new Promise(r => out.toBlob(r, "image/jpeg", 0.9)) });
    document.title = "SHEET";
    return;
  }
  if (Q.has("audit")) {   // clipping audit: footprints (ovals along each dog's heading) and props, every 3rd frame
    const N = Math.round(TOTAL * FPS), hits = {};
    const foot = d => {   // half length / half width of a dog's footprint, from its bounding box at rest scale
      d.fp ||= (() => { const b = new THREE.Box3().setFromObject(d.model); const s = d.group.scale.x;
        return [Math.max(b.max.z - b.min.z, b.max.x - b.min.x) / 2 / s * 0.8, Math.min(b.max.z - b.min.z, b.max.x - b.min.x) / 2 / s * 0.8]; })();
      return [d.fp[0] * d.scale, d.fp[1] * d.scale];
    };
    for (let f = 0; f < N; f++) {
      step(1 / FPS);
      if (f % 3) continue;
      const shot = shotIx;
      const list = actors.filter(a => a.group.parent);
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        const pa = a.group.position, pb = b.group.position;
        const d = Math.hypot(pa.x - pb.x, pa.z - pb.z);
        const ra = (foot(a)[0] + foot(a)[1]) / 2, rb = (foot(b)[0] + foot(b)[1]) / 2;   // a round-ish footprint
        const over = ra + rb - d;
        if (over > 0.05) {
          const k = `${shot}:${a.slug}~${b.slug}`;
          if (!hits[k] || hits[k].over < over) hits[k] = { t: +T.toFixed(2), over: +over.toFixed(2), shot };
        }
      }
      for (const m of things) {
        if (!m.parent || !m.isObject3D || m.isMesh && !m.geometry) continue;
        const bb = new THREE.Box3().setFromObject(m); if (bb.isEmpty()) continue;
        const c = bb.getCenter(new THREE.Vector3()), rr = Math.min(bb.max.x - bb.min.x, bb.max.z - bb.min.z) / 2;
        for (const a of list) {
          const pa = a.group.position, d = Math.hypot(pa.x - c.x, pa.z - c.z);
          const over = rr + (foot(a)[0] + foot(a)[1]) / 2 * 0.6 - d;
          if (over > 0.05 && rr > 0.05) {
            const k = `${shot}:${a.slug}~prop`;
            if (!hits[k] || hits[k].over < over) hits[k] = { t: +T.toFixed(2), over: +over.toFixed(2), shot };
          }
        }
      }
    }
    window.audit = Object.entries(hits).map(([k, v]) => ({ pair: k, ...v })).sort((a, b) => b.over - a.over);
    document.title = "AUDIT";
    return;
  }
  if (Q.has("at")) {
    const target = +Q.get("at");
    while (T + 1 / FPS <= target) step(1 / FPS);
    document.title = "AT " + T.toFixed(2);
    return;
  }
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (T + dt >= TOTAL) { T = 0; shotIx = -1; events = []; seed = 7; }
    step(dt);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
window.TOTAL = TOTAL;
window.STARTS = STARTS;
main();
</script>
</body>
</html>
