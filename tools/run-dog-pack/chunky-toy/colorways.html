<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chonky Hounds: Doggo Dynasties — colorways</title>
<style>
  body { margin: 0; padding: 14px 18px; background: #e9e9ec; font-family: system-ui, sans-serif; color: #333; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: #777; font-size: 13px; }
  h2 { font-size: 14px; margin: 18px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  figure { margin: 0; width: 150px; background: #f4f4f6; border: 1px solid #d6d6db; border-radius: 8px; overflow: hidden; cursor: pointer; }
  figure.orig { border-color: #999; }
  figure img { display: block; width: 150px; height: 150px; }
  figcaption { font-size: 11px; padding: 4px 7px 6px; line-height: 1.3; }
  figcaption small { color: #999; display: block; }
  #edit { position: fixed; right: 14px; top: 14px; width: 330px; background: #fff; border-radius: 10px; box-shadow: 0 4px 24px #0003; padding: 10px; display: none; }
  #edit canvas { width: 310px; height: 310px; display: block; border-radius: 6px; background: #f4f4f6; }
  #edit label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; margin: 3px 0; }
  #edit input[type=range] { width: 90px; }
  #edit .x { float: right; cursor: pointer; }
</style>
</head>
<body>
<h1>Chonky Hounds: Doggo Dynasties — colorways</h1>
<p class="sub" id="sub">Rendering…</p>
<div id="list"></div>
<div id="edit"><span class="x" id="close">✕</span><b id="etitle"></b><canvas id="ec"></canvas><div id="controls"></div></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
// Every breed's original and its colorways, rendered through the coat shader (dogcoat.js):
// one set of mask textures per breed, a palette per colorway. Click a colorway to edit its
// palette live. ?breed=a,b limits the list.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { loadCoats } from './dogcoat.js';

const BUILD = Date.now();
const only = new URLSearchParams(location.search).get('breed')?.split(',');
const coats = await loadCoats(`coats.json?v=${BUILD}`, 'rigged/coats/');
const names = Object.fromEntries((await (await fetch('breeds.csv')).text()).trim().split('\n').slice(1)
  .map(l => l.split(',')).map(([s, n]) => [s, n]));

function stage(canvas, size) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, ...(canvas ? { canvas } : {}) });
  renderer.setSize(size, size, !canvas);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf4f4f6);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b0b8, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(-2, 4, 3);
  scene.add(sun);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  camera.position.set(-1.9, 1.15, 2.6);
  camera.lookAt(0, 0.45, 0);
  return { renderer, scene, camera };
}
const S = stage(null, 300);
const loader = new GLTFLoader();
const dogs = {};
async function dog(breed) {
  if (!dogs[breed]) {
    const g = (await loader.loadAsync(`rigged/${breed}.glb?v=${BUILD}`)).scene;
    dogs[breed] = { g, coat: await coats.apply(g, breed) };
  }
  return dogs[breed];
}

const list = document.getElementById('list');
let count = 0;
for (const [breed, info] of Object.entries(coats.index)) {
  if (only && !only.includes(breed)) continue;
  list.insertAdjacentHTML('beforeend', `<h2>${names[breed] || breed}</h2><div class="row" id="r-${breed}"></div>`);
  const row = document.getElementById(`r-${breed}`);
  const d = await dog(breed);
  S.scene.add(d.g);
  for (const e of [{ slug: '', name: 'Original' }, ...info.colorways]) {
    d.coat.set(e.slug ? e : null);
    S.renderer.render(S.scene, S.camera);
    const fig = document.createElement('figure');
    fig.className = e.slug ? '' : 'orig';
    fig.innerHTML = `<img src="${S.renderer.domElement.toDataURL('image/jpeg', 0.85)}">
      <figcaption>${e.name}${e.like ? `<small>looks like: ${e.like}</small>` : ''}${e.note ? `<small>${e.note}</small>` : ''}</figcaption>`;
    fig.onclick = () => edit(breed, e);
    row.append(fig);
    count++;
  }
  S.scene.remove(d.g);
}
const masks = Object.values(coats.index).reduce((n, b) => n + b.masks.length, 0);
document.getElementById('sub').textContent = `${count} looks · ${masks} small mask textures in all ` +
  `(a colorway is just a palette) · click one to edit its colors`;

// ---------------------------------------------------------------- live palette editor
const E = stage(document.getElementById('ec'), 310);
let editing = null, spin = 0;
async function edit(breed, entry) {
  edit.current = null;
  const info = coats.index[breed];
  const pal = JSON.parse(JSON.stringify(entry.slug ? entry : { ...info.original, layers: info.layers.map(() => ['#000000', 0]) }));
  if (editing) E.scene.remove(editing.g);
  const d = await dog(breed);
  editing = { g: SkeletonUtils.clone(d.g), pal };
  editing.coat = await coats.apply(editing.g, breed);
  E.scene.add(editing.g);
  editing.coat.set(pal);
  document.getElementById('edit').style.display = 'block';
  document.getElementById('etitle').textContent = `${names[breed]} · ${entry.name}`;
  const c = document.getElementById('controls');
  c.innerHTML = '';
  const add = (label, get, set, alpha) => {
    const l = document.createElement('label');
    l.innerHTML = `<span>${label}</span><span><input type="color" value="${get()[0]}">` +
      (alpha ? ` <input type="range" min="0" max="1" step="0.05" value="${get()[1]}">` : '') + '</span>';
    l.querySelectorAll('input').forEach(i => i.oninput = () => {
      set(l.querySelector('[type=color]').value, +(l.querySelector('[type=range]')?.value ?? 1));
      editing.coat.set(pal);
    });
    c.append(l);
  };
  info.sources.forEach((s, i) => add(`coat: ${s}`, () => [pal.src[i]], v => { pal.src[i] = v; }));
  info.layers.forEach((s, i) => add(`marking: ${s}`, () => pal.layers[i], (v, a) => { pal.layers[i] = [v, a]; }, true));
  add('nose', () => [pal.nose], v => { pal.nose = v; });
  pal.marks ||= {};
  c.insertAdjacentHTML('beforeend', '<div style="font-size:11px;color:#888;margin:6px 0 2px">markings (no textures: size 0 = off)</div>');
  coats.marks.forEach(m => add(m.replace('_', ' '), () => pal.marks[m] || ['#ffffff', 0],
    (v, a) => { pal.marks[m] = [v, a]; }, true));
  const rnd = document.createElement('button');
  rnd.textContent = 'Randomize';
  rnd.onclick = () => { randomize(info, pal); editing.coat.set(pal); edit.current(); };
  c.append(rnd);
  edit.current = () => edit(breed, { ...pal, slug: 'custom', name: 'Custom' });
}

// A random dog: coat colors from natural coat tones, a pattern layer or two, a few markings.
const COATS = ['#1d1b1a', '#3a3836', '#5b3524', '#6f4630', '#8f3d1d', '#ad5c2c', '#b8742c', '#d79a4c', '#dfc497',
  '#ecdcbd', '#eeedea', '#7e838c', '#9a8a86', '#c79c6c'];
const pick = a => a[Math.floor(Math.random() * a.length)];
function randomize(info, pal) {
  pal.src = pal.src.map(() => pick(COATS));
  pal.layers = info.layers.map(() => Math.random() < 0.3 ? [pick(COATS), 1] : ['#000000', 0]);
  pal.marks = {};
  const white = Math.random() < 0.8 ? '#eeedea' : pick(COATS);
  if (Math.random() < 0.6) {
    const h = pick([0.12, 0.2, 0.3, 0.45]);
    const legs = pick([['fl', 'fr'], ['fl', 'fr', 'hl', 'hr'], ['hl', 'hr'], ['fl']]);
    legs.forEach(l => { pal.marks['sock_' + l] = [white, h * (0.8 + 0.4 * Math.random())]; });
  }
  for (const [m, p] of [['muzzle', 0.35], ['blaze', 0.3], ['bib', 0.4], ['tail_tip', 0.3]])
    if (Math.random() < p) pal.marks[m] = [white, 0.4 + 0.6 * Math.random()];
  if (Math.random() < 0.2) pal.marks[pick(['eye_l', 'eye_r'])] = [pick(COATS), 0.6 + 0.4 * Math.random()];
  if (Math.random() < 0.2) pal.marks.mask = ['#2a2322', 0.6 + 0.4 * Math.random()];
}
document.getElementById('close').onclick = () => { document.getElementById('edit').style.display = 'none'; };
(function loop() {
  requestAnimationFrame(loop);
  if (!editing || document.getElementById('edit').style.display === 'none') return;
  spin += 0.01;
  editing.g.rotation.y = Math.sin(spin) * 0.8;
  E.renderer.render(E.scene, E.camera);
})();
// Review helper: every figure on one image (served by a PUT-capable dev server).
window.sheet = async (name = 'sheet', S = 200, C = 8) => {
  const figs = [...document.querySelectorAll('figure')];
  const cv = document.createElement('canvas');
  cv.width = C * S; cv.height = Math.ceil(figs.length / C) * (S + 14);
  const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.font = '11px sans-serif';
  figs.forEach((f, i) => {
    const px = (i % C) * S, py = Math.floor(i / C) * (S + 14);
    x.drawImage(f.querySelector('img'), px, py + 14, S, S);
    x.fillStyle = '#000';
    x.fillText(f.closest('.row').previousElementSibling.textContent.slice(0, 12) + ' · ' +
      f.querySelector('figcaption').firstChild.textContent.slice(0, 22), px + 3, py + 11);
  });
  await fetch(`/${name}.png`, { method: 'PUT', body: await new Promise(r => cv.toBlob(r, 'image/png')) });
  return figs.length;
};
window.ready = true;
</script>
</body>
</html>
