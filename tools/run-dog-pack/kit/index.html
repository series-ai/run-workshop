<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RUN Dog Pack — breed gallery</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e9ec; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .label { font-size: 10px; color: #333; background: #ffffffcc; padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
  .label.sel { background: #4a7cff; color: #fff; }
  .section { font-size: 13px; font-weight: 700; color: #222; background: #fff; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; }
  #top { z-index: 2; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 8px; padding: 6px 10px; box-shadow: 0 2px 10px #0002; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  #panel { z-index: 2; position: fixed; left: 12px; top: 12px; width: 260px; background: #fff; border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 10px #0002; font-size: 13px; }
  #panel h2 { margin: 0 0 2px; font-size: 15px; }
  #notes { color: #888; font-size: 11px; margin-bottom: 6px; min-height: 13px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; gap: 6px; }
  .row span { width: 56px; }
  #panel select { width: 118px; }
  #panel input[type=color] { width: 44px; height: 24px; border: none; padding: 0; background: none; }
  #panel input[type=range] { width: 118px; }
  #stats { margin-top: 10px; color: #777; font-size: 11px; line-height: 1.5; }
  #nowPlaying { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 10px;
    padding: 8px 16px; box-shadow: 0 2px 10px #0002; font: 600 20px system-ui, sans-serif; display: none; z-index: 2; }
  #nowPlaying small { font-weight: 400; color: #888; font-size: 13px; margin-left: 8px; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #888; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="top">Show <select id="filter"></select> <label><input type="checkbox" id="showLabels" checked> labels</label>
  Palette <select id="palette"><option>papercraft</option><option>natural</option></select>
  Anim <button id="animPrev" title="previous clip (←)">◀</button><select id="anim"><option value="">(rest)</option></select><button id="animNext" title="next clip (→)">▶</button>
  <button id="animCycle" title="play every clip in turn (space)">Play all</button>
  <label><input type="checkbox" id="animAll"> all shown</label>
  <label><input type="checkbox" id="toy"> toy</label> <select id="toyKind"></select></div>
<div id="nowPlaying"></div>
<div id="panel">
  <div class="row"><h2 id="name">—</h2><button id="focus">Focus</button></div>
  <div id="notes"></div>
  <div class="row"><span>Build</span><select id="build"></select><b id="len"></b></div>
  <div class="row"><span>Size</span><input type="range" id="size" min="0.2" max="1.5" step="0.01"></div>
  <div class="row"><span>Ears</span><select id="ears"></select></div>
  <div class="row"><span>Tail</span><select id="tail"></select></div>
  <div class="row"><span>Head</span><select id="head"></select></div>
  <div class="row"><span>Coat</span><select id="fur"></select></div>
  <div class="row"><span>Base</span><select disabled><option>coat</option></select><input type="color" id="c0"></div>
  <div class="row"><span>Layer 1</span><select id="p1"></select><input type="color" id="c1"></div>
  <div class="row"><span>Layer 2</span><select id="p2"></select><input type="color" id="c2"></div>
  <div class="row"><span>Layer 3</span><select id="p3"></select><input type="color" id="c3"></div>
  <div class="row"><span>Nose</span><select id="noseP"></select><input type="color" id="nose"></div>
  <div class="row"><span>Wear</span><div id="wearBoxes" style="flex:1;font-size:11px;line-height:1.7"></div></div>
  <div id="stats"></div>
</div>
<div id="labels"></div>
<div id="hint">Click a dog to edit it · drag to orbit · scroll to zoom · ← → step clips · space plays them all</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { loadKit } from './kitcore.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeef1);
// Dogs light themselves in their shader; these lights are for props (toys).
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a96, 1.6));
const propSun = new THREE.DirectionalLight(0xffffff, 1.8);
propSun.position.set(3, 5, 4);
scene.add(propSun);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let needsRender = true;
const redraw = () => { needsRender = true; };
THREE.DefaultLoadingManager.onLoad = redraw;

const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.46, 40), new THREE.MeshBasicMaterial({ color: 0x4a7cff }));
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.003;
scene.add(ring);


// The dog kit (data, shader, assets, dog assembly) lives in dogkit.js.
const kit = await loadKit({
  scene, redraw,
  palette: () => document.getElementById('palette').value,
  makeLabel: spec => {
    const el = document.createElement('div');
    el.className = 'label';
    el.textContent = spec.name;
    const label = new CSS2DObject(el);
    scene.add(label);
    return label;
  },
});
const { BUILDS, HEADS, EARS, TAILS, FURS, PATTERNS, COLOURS, NOSES, SIZE, COMPARE, toSpec, builds, WEARABLES, toys,
        TOY_ORDER, makeDog, apply, play, playing, clock, updateProps, stageToy, paletteFn } = kit;
let rows = kit.rows;
const bodyTris = kit.bodyTris;


// ---- layout: one section per build (rows of up to 10), sections packed into 3 columns ----
const COLS = 10, SECTION_COLS = 3;
// Grid cell grows with the biggest dog so giant breeds don't overlap.
const cellFor = list => Math.max(1.6, Math.max(...list.map(d => d.length)) * 1.55);
const SECTION_W = COMPARE ? 0 : COLS * cellFor([{ length: SIZE.XL }]) + 2.5;
const dogs = [], sections = {};
window.__dogs = dogs;   // for headless checks
window.__view = () => ({ camera, controls });
const colZ = new Array(COMPARE ? 1 : SECTION_COLS).fill(0);
// ?review=sit&breeds=A,B&n=6 : review sheet. Rows = breeds, columns = moments of
// the clip, all seen exactly from the side on their own floor line, so one
// screenshot shows a clip across very different builds.
const P = new URLSearchParams(location.search);
const REVIEW = P.get('review');
const REVIEW_BREEDS = (P.get('breeds') || 'Great Dane,German Shepherd,Labrador Retriever,Pembroke Welsh Corgi,Pug,'
  + 'Dachshund,Standard Poodle,Siberian Husky').split(',').map(x => x.trim());
const SECTION_KEYS = COMPARE ? ['previous', 'new'] : REVIEW ? [] : [...BUILDS, 'any'];
if (REVIEW) {
  // review=a,b,c (several clips): one breed, a row per clip, columns at even
  // fractions of each clip. review=a: a row per breed, columns in seconds.
  const CLIPS_R = REVIEW.split(',');
  const MULTI = CLIPS_R.length > 1;
  const breedSpecs = REVIEW_BREEDS.map(n => rows.find(r => r.breed === n)).filter(Boolean).map(toSpec);
  const picked = MULTI ? CLIPS_R.map(c => ({ ...breedSpecs[0], clipName: c, name: c })) : breedSpecs.map(b => ({ ...b, clipName: REVIEW }));
  const clipLen = builds.shepherd.clips.find(c => c.name === CLIPS_R[0])?.duration || 1;
  const n = +(P.get('n') || 6);
  const times = (P.get('times') || '').split(',').filter(Boolean).map(Number);
  const T = MULTI ? [...Array(n)].map((_, j) => j / (n - 1)) : times.length ? times : [...Array(n)].map((_, j) => (clipLen * j) / (n - 1));
  const CELLX = T.length === 1 && !MULTI ? +(P.get('cell') || 1.1) : 1.7, ROWH = 1.6;
  const members = [];
  // A single moment (times=x) lays the breeds out side by side instead of in rows.
  const ONE = T.length === 1 && !MULTI;
  picked.forEach((spec, i) => {
    const y = ONE ? 0 : -i * ROWH, x0 = ONE ? i * CELLX : 0;
    const bar = new THREE.Mesh(new THREE.BoxGeometry(T.length * CELLX, 0.01, 0.6), new THREE.MeshBasicMaterial({ color: 0xc9c9d2 }));
    bar.position.set(x0 + (T.length - 1) * CELLX / 2, y - 0.005, 0);
    scene.add(bar);
    const el = document.createElement('div');
    el.className = 'section';
    el.textContent = spec.name;
    const lab = new CSS2DObject(el);
    lab.position.set(ONE ? x0 : -1.3, ONE ? y - 0.25 : y + 0.3, 0);
    scene.add(lab);
    T.forEach((t0, j) => {
      let t = t0;
      const dog = makeDog({ ...spec, name: `${spec.name} @${t.toFixed(2)}` });
      dog.label.element.style.display = 'none';
      dog.group.position.set(x0 + j * CELLX, y, 0);
      scene.add(dog.group);
      apply(dog);
      // Giants scaled down to fit the cell; &fit=1 blows every dog up to fill it.
      dog.group.scale.setScalar(Math.min(1.1, dog.length));
      if (P.get('fit')) {
        dog.group.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(dog.group);
        dog.group.scale.multiplyScalar(+(P.get('fit')) * 1.25 / (box.max.x - box.min.x));
      }
      // &cam=top / &cam=front turn each dog so the camera sees its back / its face.
      if (P.get('cam') === 'top') dog.group.rotation.x = Math.PI / 2;
      if (P.get('cam') === 'front') dog.group.rotation.y = -Math.PI / 2;
      if (P.get('yaw')) dog.group.rotation.y = THREE.MathUtils.degToRad(+P.get('yaw'));   // e.g. -35 for 3/4
      if (P.get('tilt')) { dog.group.rotation.order = 'YXZ'; dog.group.rotation.x = THREE.MathUtils.degToRad(+P.get('tilt')); }   // look from above
      const clip = builds[dog.build].clips.find(c => c.name === spec.clipName);
      if (MULTI && clip) t = t * clip.duration;
      if (clip && P.get('toy')) {
        // Simulate from the start so dropped/thrown toys are where they'd be at t.
        dog.toy = true;
        const s0 = dog.group.scale.x;
        apply(dog);
        dog.group.scale.setScalar(s0);   // apply() resets the size; keep the sheet's
        dog.mixer = new THREE.AnimationMixer(dog.rig);
        const a = dog.mixer.clipAction(clip);
        a.setLoop(THREE.LoopOnce, 1);
        a.clampWhenFinished = true;
        a.play();
        stageToy(dog, clip);
        dog.mixer.update(0);
        const dt = 1 / 60;
        for (let k = 0; k * dt < t; k++) { dog.mixer.update(dt); dog.rig.updateMatrixWorld(true); updateProps(dog, dt); }
      } else if (clip) {
        dog.mixer = new THREE.AnimationMixer(dog.rig);
        dog.mixer.clipAction(clip).play();
        dog.mixer.setTime(Math.min(t, clip.duration - 1e-3));
        dog.rig.updateMatrixWorld(true);
        updateProps(dog, 0);
      }
      dogs.push(dog);
      members.push(dog);
    });
  });
  T.forEach((t, j) => {
    const el = document.createElement('div');
    el.className = 'section';
    el.textContent = MULTI ? `${Math.round(t * 100)}%` : `${t.toFixed(2)}s`;
    const lab = new CSS2DObject(el);
    lab.position.set(j * CELLX, 1.25, 0);
    scene.add(lab);
  });
  sections.review = { head: new THREE.Object3D(), members };
  camera.fov = 14;
  const cols = ONE ? picked.length : T.length, rowsN = ONE ? 1 : picked.length;
  const w = cols * CELLX + (ONE ? 0.6 : 2.5), h = rowsN * ROWH + (ONE ? 0.2 : 1.2);
  const cx = (cols - 1) * CELLX / 2 - (ONE ? 0 : 0.5), cy = -(rowsN - 1) * ROWH / 2 + 0.4;
  const dist = Math.max(w / (innerWidth / innerHeight), h) / (2 * Math.tan(THREE.MathUtils.degToRad(7))) * 1.02;
  camera.position.set(cx, cy, dist);
  controls.target.set(cx, cy, 0);
}
for (const build of SECTION_KEYS) {
  const list = rows.filter(r => (COMPARE ? r.section : r.build) === build).map(toSpec);
  if (!list.length) continue;
  const CELL = cellFor(list);
  const col = colZ.indexOf(Math.min(...colZ));
  const x0 = COMPARE ? 0 : (col - (SECTION_COLS - 1) / 2) * SECTION_W, z = colZ[col];
  const title = document.createElement('div');
  title.className = 'section';
  title.textContent = build === 'any' ? 'mixed' : build;
  const head = new CSS2DObject(title);
  head.position.set(x0, 0, z - 0.9);
  scene.add(head);
  const members = [];
  list.forEach((spec, i) => {
    const dog = makeDog(spec);
    const n = COMPARE ? list.length : COLS;
    dog.group.position.set(x0 + ((i % n) - (Math.min(n, list.length) - 1) / 2) * CELL, 0, z + Math.floor(i / n) * CELL);
    dog.group.rotation.y = -0.45;
    scene.add(dog.group);
    apply(dog);
    dogs.push(dog);
    members.push(dog);
  });
  sections[build] = { head, members };
  colZ[col] += Math.ceil(list.length / COLS) * CELL + 2;
}
const depth = Math.max(...colZ);
const floor = REVIEW ? new THREE.Object3D() : new THREE.Mesh(new THREE.PlaneGeometry(COMPARE ? 40 : SECTION_COLS * SECTION_W + 2, depth + 3),
  new THREE.MeshBasicMaterial({ color: 0xe2e2e7 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, depth / 2 - 1.5);
scene.add(floor);

// ---- filter + camera framing ----
const $ = id => document.getElementById(id);
const opts = list => list.map(v => `<option>${v}</option>`).join('');
$('filter').innerHTML = `<option value="all">all ${dogs.length} breeds</option>`
  + Object.entries(sections).map(([b, s]) => `<option value="${b}">${b === 'any' ? 'mixed' : b} (${s.members.length})</option>`).join('');
function frame(members) {
  const box = new THREE.Box3();
  members.forEach(d => box.expandByObject(d.group));
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const d = Math.max(size.x, size.z) * 1.1 + 2;
  controls.target.copy(c);
  camera.position.set(c.x + d * 0.05, c.y + d * 0.75, c.z + d * 0.8);
  redraw();
}
let lastFilter;
// Close-up of one dog; pressing Focus again alternates side and 3/4-front views.
let focusView = 0;
function focus(dog, view = focusView) {
  const box = new THREE.Box3().expandByObject(dog.group);
  const c = box.getCenter(new THREE.Vector3());
  const d = dog.length * 3.2;
  controls.target.copy(c);
  if (view === 0) camera.position.set(c.x - d * 0.42, c.y + d * 0.18, c.z + d * 0.9);   // side
  else camera.position.set(c.x + d * 0.33, c.y + d * 0.22, c.z + d * 0.94);           // 3/4 front
  redraw();
}
function applyFilter() {
  const f = $('filter').value;
  if (f !== lastFilter) $('showLabels').checked = f !== 'all' || !!COMPARE;   // too dense to read in the overview
  lastFilter = f;
  const labels = $('showLabels').checked;
  for (const [b, s] of Object.entries(sections)) {
    const on = f === 'all' || f === b;
    s.head.visible = on;
    for (const d of s.members) { d.group.visible = on; d.label.visible = on && labels; }
  }
  if (!REVIEW) frame(f === 'all' ? dogs : sections[f].members);
  if (selected && f !== 'all') select(sections[f].members[0]);
}
$('filter').addEventListener('input', applyFilter);
$('palette').addEventListener('input', () => dogs.forEach(apply));
$('showLabels').addEventListener('input', applyFilter);

// ---- editor panel ----
$('build').innerHTML = opts(BUILDS);
$('ears').innerHTML = opts(EARS);
$('tail').innerHTML = opts(TAILS);
$('fur').innerHTML = opts(FURS);
$('head').innerHTML = opts(HEADS);
for (const i of [1, 2, 3]) $(`p${i}`).innerHTML = opts(Object.keys(PATTERNS));
$('noseP').innerHTML = NOSES.map(n => `<option value="${COLOURS[n]}">${n}</option>`).join('');
let selected;
function select(dog) {
  if (selected) selected.label.element.classList.remove('sel');
  selected = dog;
  dog.label.element.classList.add('sel');
  $('name').textContent = dog.name;
  $('notes').textContent = dog.notes || '';
  $('build').value = dog.build; $('ears').value = dog.ears; $('tail').value = dog.tail; $('fur').value = dog.fur; $('head').value = dog.head;
  $('size').value = dog.length; $('len').textContent = `${dog.length.toFixed(2)} m`;
  $('c0').value = dog.coat;
  for (const i of [1, 2, 3]) {
    const [name, color] = dog.layers[i - 1] || ['none', '#ffffff'];
    $(`p${i}`).value = name;
    $(`c${i}`).value = color;
  }
  $('nose').value = dog.nose;
  document.querySelectorAll('[data-wear]').forEach(b => { b.checked = dog.wear.has(b.dataset.wear); });
  $('noseP').value = [...$('noseP').options].some(o => o.value === dog.nose) ? dog.nose : '';
  ring.position.set(dog.group.position.x, 0.003, dog.group.position.z);
  ring.scale.setScalar(Math.max(0.6, dog.length));
  redraw();
}
function edit() {
  Object.assign(selected, { build: $('build').value, ears: $('ears').value, tail: $('tail').value, fur: $('fur').value, head: $('head').value,
                            length: +$('size').value, coat: $('c0').value, nose: $('nose').value });
  selected.layers = [1, 2, 3].map(i => [$(`p${i}`).value, $(`c${i}`).value]);
  $('len').textContent = `${selected.length.toFixed(2)} m`;
  apply(selected);
}
for (const id of ['build', 'head', 'ears', 'tail', 'fur', 'size', 'c0', 'p1', 'c1', 'p2', 'c2', 'p3', 'c3', 'nose']) $(id).addEventListener('input', edit);
$('noseP').addEventListener('input', e => { $('nose').value = e.target.value; edit(); });
$('focus').addEventListener('click', () => { focus(selected); focusView = 1 - focusView; });
select(dogs[0]);
$('stats').innerHTML = `${dogs.length} breeds · ${BUILDS.length} builds · ${EARS.length} ears · ${TAILS.length} tails<br>`
  + `body ${bodyTris} tris (shared topology) + ears/tail ≈ 1k<br>coat shells: ruff, puff, feathered, curly, shaggy, poodle clip (wire beards not yet)`;

const ray = new THREE.Raycaster();
let down;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const hit = ray.intersectObjects(dogs.filter(d => d.group.visible).map(d => d.group), true)[0];
  if (hit) select(hit.object.userData.dog);
});

// Draw only when something changed, so an idle tab costs almost no battery.
controls.addEventListener('change', redraw);
addEventListener('resize', redraw);
// ?dog=Name opens straight onto one breed (handy for sharing a link).
const wanted = dogs.find(d => d.name === new URLSearchParams(location.search).get('dog'));
$('filter').value = COMPARE || REVIEW ? 'all' : wanted ? (wanted.build in sections ? wanted.build : 'all') : 'shepherd';
applyFilter();
if (REVIEW) for (const id of ['panel', 'top', 'hint']) $(id).style.display = 'none';
// Animation picker: plays on the selected dog, or on every shown dog.
$('anim').innerHTML += builds.shepherd.clips.map(c => `<option>${c.name}</option>`).join('');
const targets = () => ($('animAll').checked ? dogs.filter(d => d.group.visible && d.rig) : [selected]);
$('anim').addEventListener('input', () => {
  if (!$('animAll').checked) for (const d of playing) if (d !== selected) play(d, '');
  for (const d of targets()) play(d, $('anim').value);
});
$('toy').addEventListener('input', () => { for (const d of targets()) { d.toy = $('toy').checked; apply(d); } });
// Which toy: the plain ball or any prop with a socket_grip (props/props.json).
$('toyKind').innerHTML = TOY_ORDER.map(id => `<option value="${id}">${toys[id]?.label || 'ball'}</option>`).join('');
$('toyKind').addEventListener('input', () => {
  for (const d of targets()) { d.toyKind = $('toyKind').value; d.toy = true; apply(d); }
  $('toy').checked = true;
});
// Wearables on the selected dog (or every shown dog with "all shown").
$('wearBoxes').innerHTML = WEARABLES.map(w => `<label><input type="checkbox" data-wear="${w}"${selected.wear.has(w) ? ' checked' : ''}> ${w}</label>`).join(' ');
document.querySelectorAll('[data-wear]').forEach(b => b.addEventListener('input', () => {
  for (const d of targets()) { d.wear[b.checked ? 'add' : 'delete'](b.dataset.wear); apply(d); }
}));
// ---- clip stepping and "Play all" ----
// The caption shows the clip playing; Play all steps through every clip in
// turn (looping clips play a couple of cycles), ◀ ▶ or the arrow keys step by hand.
const clipNames = builds.shepherd.clips.map(c => c.name);
const clipLen = name => builds.shepherd.clips.find(c => c.name === name)?.duration || 1;
function showNow() {
  const name = $('anim').value, i = clipNames.indexOf(name);
  $('nowPlaying').style.display = name ? 'block' : 'none';
  $('nowPlaying').innerHTML = `${name.replaceAll('_', ' ')}<small>${i + 1} / ${clipNames.length}`
    + `${builds.shepherd.looping.includes(name) ? ' · loop' : ''}${cycling ? ' · playing all' : ''}</small>`;
}
function setClip(name) {
  $('anim').value = name;
  $('anim').dispatchEvent(new Event('input'));
}
function stepClip(d) {
  const i = clipNames.indexOf($('anim').value);
  setClip(clipNames[(i + d + clipNames.length) % clipNames.length]);
}
let cycling = false, cycleTimer = 0;
function cycleNext(first) {
  clearTimeout(cycleTimer);
  if (!cycling) return;
  if (!first) stepClip(1);
  else if (!$('anim').value) setClip(clipNames[0]);
  else setClip($('anim').value);
  const name = $('anim').value, T = clipLen(name);
  const hold = builds.shepherd.looping.includes(name) ? Math.max(2 * T, 2.5) : T + 0.6;
  cycleTimer = setTimeout(() => cycleNext(false), hold * 1000);
}
function setCycling(on) {
  cycling = on;
  $('animCycle').textContent = on ? 'Stop' : 'Play all';
  if (on) cycleNext(true); else clearTimeout(cycleTimer);
  showNow();
}
$('anim').addEventListener('input', showNow);
$('animPrev').addEventListener('click', () => { setCycling(false); stepClip(-1); });
$('animNext').addEventListener('click', () => { setCycling(false); stepClip(1); });
$('animCycle').addEventListener('click', () => setCycling(!cycling));
addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight') { setCycling(false); stepClip(1); }
  else if (e.key === 'ArrowLeft') { setCycling(false); stepClip(-1); }
  else if (e.key === ' ') { e.preventDefault(); setCycling(!cycling); }
});
const anim = new URLSearchParams(location.search).get('anim');
if (anim) { $('anim').value = anim; $('anim').dispatchEvent(new Event('input')); }
const view = new URLSearchParams(location.search).get('view') === 'front' ? 1 : 0;
if (wanted) { select(wanted); focus(wanted, view); focusView = 1 - view; }
function loop() {
  if (renderer.domElement.width !== innerWidth * devicePixelRatio) {
    renderer.setSize(innerWidth, innerHeight);
    labelRenderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  controls.update();
  if (playing.size) {   // animate only while a clip is playing, then go back to idle rendering
    const dt = Math.min(clock.getDelta(), 0.1);
    for (const d of playing) { d.mixer.update(dt); updateProps(d, dt); }
    needsRender = true;
  }
  if (needsRender) {
    needsRender = false;
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
