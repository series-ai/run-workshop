<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Facet Fauna: Dogs - ready-made breeds</title>
<style>
  body { margin: 0; background: #eeeef1; font: 13px system-ui, sans-serif; overflow: hidden; }
  #top { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 10px;
    padding: 8px 12px; box-shadow: 0 2px 10px #0002; z-index: 2; white-space: nowrap; }
  #now { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 10px;
    padding: 8px 16px; box-shadow: 0 2px 10px #0002; font: 600 18px system-ui; }
  .label { font-size: 11px; color: #555; background: #fffc; padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<div id="top">Ready-made breeds (plain GLTFLoader, standard material) ·
  Clip <button id="prev">◀</button><select id="clip"></select><button id="next">▶</button>
  <button id="cycle">Play all</button></div>
<div id="now"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
// What a game gets from kit/breeds/*.glb: load, add, play a clip. No custom
// shader or assembly - the coat is a texture, head, jaw and ears are skinned in.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const P = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.cssText = 'position:fixed;top:0;pointer-events:none';
document.body.appendChild(labels.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeef1);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a96, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(2, 4, 3);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);

const index = await (await fetch(`breeds/index.json?t=${Date.now()}`)).json();
const only = P.get('breeds')?.split(',');
const list = only ? index.filter(b => only.includes(b.breed)) : index;
const loader = new GLTFLoader();
const COLS = +(P.get("cols") || 10), CELL = +(P.get("cell") || 1.3);
const cats = await Promise.all(list.map(async (b, i) => {
  const g = await loader.loadAsync(`breeds/${b.file}?t=${Date.now()}`);
  const root = g.scene;
  root.position.set((i % COLS - (Math.min(COLS, list.length) - 1) / 2) * CELL, 0, Math.floor(i / COLS) * CELL);
  root.rotation.y = -(+P.get('rot') || 0.6);
  scene.add(root);
  root.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  const el = document.createElement('div');
  el.className = 'label';
  el.textContent = b.breed;
  const lab = new CSS2DObject(el);
  lab.position.set(root.position.x, -0.05, root.position.z + 0.3);
  scene.add(lab);
  return { root, clips: g.animations, mixer: new THREE.AnimationMixer(root),
           looping: root.getObjectByName('rig')?.userData.looping_clips || [] };
}));
const names = cats[0].clips.map(c => c.name);
$('clip').innerHTML = names.map(n => `<option>${n}</option>`).join('');
function play(name, t = null) {
  for (const c of cats) {
    c.mixer.stopAllAction();
    const clip = c.clips.find(k => k.name === name);
    const a = c.mixer.clipAction(clip);
    a.setLoop(c.looping.includes(name) ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    a.clampWhenFinished = true;
    a.play();
    if (t !== null) c.mixer.setTime(Math.min(t, clip.duration - 1e-3));
  }
  $('clip').value = name;
  $('now').textContent = `${name.replaceAll('_', ' ')}  ${names.indexOf(name) + 1} / ${names.length}`;
}
let cycling = false, timer = 0;
function step(d) { play(names[(names.indexOf($('clip').value) + d + names.length) % names.length]); }
function cycle() {
  clearTimeout(timer);
  if (!cycling) return;
  const c = cats[0].clips.find(k => k.name === $('clip').value);
  timer = setTimeout(() => { step(1); cycle(); }, (cats[0].looping.includes(c.name) ? Math.max(2 * c.duration, 2.5) : c.duration + 0.6) * 1000);
}
$('clip').oninput = () => play($('clip').value);
$('prev').onclick = () => { cycling = false; step(-1); };
$('next').onclick = () => { cycling = false; step(1); };
$('cycle').onclick = () => { cycling = !cycling; $('cycle').textContent = cycling ? 'Stop' : 'Play all'; cycle(); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { cycling = false; step(1); }
  if (e.key === 'ArrowLeft') { cycling = false; step(-1); }
  if (e.key === ' ') { e.preventDefault(); $('cycle').click(); }
});
// ?clip=sit_idle&t=1.2 freezes every cat at that moment (for screenshots).
const frozen = P.has('t');
play(P.get('clip') || 'idle', frozen ? +P.get('t') : null);

const rows = Math.ceil(list.length / COLS);
const w = Math.min(COLS, list.length) * CELL, d = rows * CELL;
const zoom = +(P.get('zoom') || 1);
camera.position.set(0, (Math.max(w, d) * 0.5 + 0.3) / zoom, (Math.max(w, d) * 1.1 + 0.8) / zoom);
controls.target.set(0, +(P.get('ty') || 0.15), (rows - 1) * CELL / 2);
camera.position.y += +(P.get('ty') || 0.15) - 0.15;
// ?cam=x,y,z&target=x,y,z: an exact camera (for close checks)
if (P.get('cam')) { camera.position.fromArray(P.get('cam').split(',').map(Number)); controls.target.fromArray((P.get('target') || '0,0.3,0').split(',').map(Number)); }
controls.update();
const clock = new THREE.Clock();
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  labels.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (!frozen) for (const c of cats) c.mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
</script>
</body>
</html>
