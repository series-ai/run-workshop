<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chonky Cats: props</title>
<style>body { margin: 0; background: #eceae4; } canvas { display: block; }</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
// Every cat prop (models/, from props.csv) at its real size on a grid, each beside a sitting
// medium Moggy (scale 0.55) for scale. Serve tools/run-dog-pack and open
// chonky-cats/props/props-check.html. ?save=<name> posts a screenshot (capture.py style).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { loadClipLibrary, setupDog } from '../../chunky-toy/dogclips.js';

const q = new URLSearchParams(location.search);
const rows = (await (await fetch('props.csv')).text()).trim().split('\n').slice(1)
  .map(l => l.match(/^([^,]+),([^,]+),([^,]+),([^,]+),([^,]+)/).slice(1));
const COLS = 6, CELL = 1.3;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceae4);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a917f, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-3, 6, 4);
scene.add(sun);
const loader = new GLTFLoader();
const lib = await loadClipLibrary(loader, '../rigged/clips.glb');
const catGltf = await loader.loadAsync('../rigged/moggy.glb');
const nRows = Math.ceil(rows.length / COLS);
const label = (text, x, z) => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 64;
  const g = c.getContext('2d'); g.font = '34px system-ui'; g.fillStyle = '#333'; g.textAlign = 'center';
  g.fillText(text, 256, 44);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.14), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.002, z + 0.5); scene.add(m);
};
const { clone } = await import('three/addons/utils/SkeletonUtils.js');
const cats = [];
for (const [i, [slug, name]] of rows.entries()) {
  const x = (i % COLS - (COLS - 1) / 2) * CELL, z = (Math.floor(i / COLS) - (nRows - 1) / 2) * CELL;
  const tile = new THREE.Mesh(new THREE.PlaneGeometry(CELL - 0.1, CELL - 0.1), new THREE.MeshLambertMaterial({ color: 0xd9d4c6 }));
  tile.rotation.x = -Math.PI / 2; tile.position.set(x, 0, z); scene.add(tile);
  try {
    const prop = (await loader.loadAsync(`models/${slug}.glb`)).scene;
    prop.position.set(x + 0.15, 0, z);
    scene.add(prop);
  } catch (e) { label('missing: ' + slug, x, z - 0.4); }
  const cat = clone(catGltf.scene);
  cat.scale.setScalar(0.55);   // a medium cat (sizes in ../README.md)
  cat.position.set(x - 0.45, 0, z);
  cat.rotation.y = Math.PI / 4;
  scene.add(cat);
  const dog = setupDog(cat, lib);
  dog.play('sit_loop', { fade: 0 });
  dog.update(0.5);
  cats.push(dog);
  label(name, x, z);
}
// A row of staged combinations: a dirty litter tray, a cat sitting in the box, a cat on top of the tree.
async function place(slug, x, z, y = 0, s = 1, ry = 0) {
  try { const o = (await loader.loadAsync(`models/${slug}.glb`)).scene; o.position.set(x, y, z); o.scale.setScalar(s); o.rotation.y = ry; scene.add(o); return o; } catch (e) { return null; }
}
function sitCat(x, y, z, clip = 'sit_loop') {
  const cat = clone(catGltf.scene); cat.scale.setScalar(0.55); cat.position.set(x, y, z); cat.rotation.y = Math.PI / 4; scene.add(cat);
  const d = setupDog(cat, lib); d.play(clip, { fade: 0 }); d.update(0.5);
}
const sz = ((nRows + 1) / 2) * CELL;
const box = new THREE.Box3();
{
  const tray = await place('litter-tray', -2 * CELL, sz);
  const top = tray ? box.setFromObject(tray).max.y * 0.8 : 0.05;
  await place('cat-poop', -2 * CELL + 0.05, sz - 0.03, top, 0.6, 0.4);
  await place('litter-clump', -2 * CELL - 0.12, sz + 0.06, top, 0.8);
  await place('pee-spot', -2 * CELL + 0.45, sz + 0.25);
  label('Dirty litter tray', -2 * CELL, sz);
  const cb = await place('cardboard-box', 0, sz);
  if (cb) sitCat(0, box.setFromObject(cb).max.y * 0.25, sz, 'loaf_loop');
  label('Box', 0, sz);
  const av = await place('avocado-bed', -CELL, sz);   // the cat is the pit
  if (av) sitCat(-CELL, box.setFromObject(av).max.y * 0.35, sz, 'loaf_loop');
  label('Avocado + cat', -CELL, sz);
  await place('cat-tree', 2 * CELL, sz);
  sitCat(2 * CELL + 0.6, 0, sz);
  label('Cat tree', 2 * CELL, sz);
}
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
const span = Math.max(COLS, (nRows + 1.5) * innerWidth / innerHeight) * CELL;
camera.position.set(0, span * 1.25, span * 1.05);
camera.lookAt(0, 0, 0.6 * CELL);
renderer.render(scene, camera);
if (q.get('save')) {
  await fetch('/save?name=' + q.get('save'), { method: 'POST', body: renderer.domElement.toDataURL('image/png') });
}
</script>
</body>
</html>
