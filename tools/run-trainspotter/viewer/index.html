<!doctype html>
<!-- Trainspotter viewer: pick a railway, run a train, set the points, set the time of day.
     npm run serve, then open http://127.0.0.1:8840/run-trainspotter/viewer/
     (?kit=<path to a kit folder with kit.json>, ?quality=High|Medium|Low, ?time=0..1) -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9cc3e6">
<title>Trainspotter viewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./viewer.css">
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { startViewer } from './viewer.js';
const q = new URLSearchParams(location.search);
await startViewer({ kitBase: q.get('kit') ?? '../out/glb/', soundsBase: q.get('sounds') ?? '../out/sounds/ogg/' });
</script>
</body>
</html>
